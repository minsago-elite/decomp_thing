import javax.inject.Inject
import org.gradle.api.DefaultTask
import org.gradle.process.ExecOperations

// Public Gradle execution service injection: Project.exec is not a Gradle 9 API.
abstract class Clang1813LoaderCapture extends DefaultTask {
    @Inject
    abstract ExecOperations getExecOperations()

    void runCommand(List<String> arguments, OutputStream output = null) {
        execOperations.exec { spec ->
            spec.commandLine(arguments)
            if (output != null) spec.standardOutput = output
        }
    }
}

// This isolated source set compiles the loader without main/classes, frontend
// acquisition, native execution, or generated application resources.
gradle.projectsEvaluated {
    def project = gradle.rootProject
    def snapshot = new File(project.buildDir, "clang1813-loader-smoke/inputs")
    def helper = new File(project.rootDir, "scripts/oracle/clang_18_1_3_loader_snapshot.py")
    def sources = project.sourceSets.create("clang1813Loader")
    sources.resources.setSrcDirs([])
    sources.java.setSrcDirs([new File(snapshot, "sources/oracle/clang/18.1.3")])
    project.kotlin.sourceSets.getByName("clang1813Loader").kotlin.setSrcDirs([
        new File(snapshot, "sources/src/main/kotlin")
    ])
    // Deliberately closed minimal dependency configuration. No main runtimeClasspath.
    def dependencies = project.configurations.getByName(sources.runtimeClasspathConfigurationName)
    project.dependencies.add(sources.implementationConfigurationName, "org.jetbrains.kotlin:kotlin-stdlib:2.4.0")
    project.dependencies.add(sources.implementationConfigurationName, "org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:1.9.0")
    project.dependencies.add(sources.implementationConfigurationName, "org.jetbrains.kotlinx:kotlinx-serialization-core-jvm:1.9.0")
    // serialization 1.9.0 requests stdlib 2.2.0. Deliberately align the whole
    // JVM stdlib family to the project's reviewed Kotlin 2.4.0 toolchain.
    // This overrides those transitive requests, not arbitrary other conflicts.
    dependencies.resolutionStrategy.force(
        "org.jetbrains.kotlin:kotlin-stdlib:2.4.0",
        "org.jetbrains.kotlin:kotlin-stdlib-common:2.4.0",
        "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.4.0",
        "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.4.0"
    )
    dependencies.resolutionStrategy.failOnVersionConflict()
    def capturedClasspath = project.files(project.provider {
        project.fileTree(new File(snapshot, "classpath")) { include "*.jar" }.files.sort()
    })
    sources.compileClasspath = capturedClasspath
    sources.runtimeClasspath = sources.output + capturedClasspath
    def manifestSha256 = null
    def capture = null
    def verifyInputs = {
        if (manifestSha256 == null) throw new GradleException("loader snapshot binding missing")
        capture.get().runCommand([
            "python3", "-B", helper.absolutePath, "verify",
            "--root", project.rootDir.absolutePath, "--output", snapshot.absolutePath,
            "--manifest-sha256", manifestSha256
        ])
    }
    capture = project.tasks.register("clang1813CaptureLoaderInputs", Clang1813LoaderCapture) {
        // Always capture a fresh private input leaf; never reuse an old snapshot.
        doLast {
            if (snapshot.exists()) {
                throw new GradleException("loader snapshot already exists; use a fresh build directory")
            }
            snapshot.parentFile.mkdirs()
            def command = ["python3", "-B", helper.absolutePath, "prepare",
                "--root", project.rootDir.absolutePath, "--output", snapshot.absolutePath]
            dependencies.files.sort().each { command.addAll(["--classpath", it.absolutePath]) }
            def stdout = new ByteArrayOutputStream()
            capture.get().runCommand(command, stdout)
            manifestSha256 = stdout.toString("UTF-8").trim()
            if (!(manifestSha256 ==~ /[0-9a-f]{64}/)) throw new GradleException("invalid snapshot binding")
        }
    }
    ["compileClang1813LoaderKotlin", "compileClang1813LoaderJava"].each { taskName ->
        project.tasks.named(taskName).configure {
            dependsOn capture
            // Verification must run even when Gradle otherwise considers outputs current.
            outputs.upToDateWhen { false }
            doFirst { verifyInputs() }
            doLast { verifyInputs() }
        }
    }
    project.tasks.register("clang1813AProfileLoaderCompile") {
        dependsOn project.tasks.named("clang1813LoaderClasses")
        doLast {
            verifyInputs()
            logger.lifecycle("Loader compilation only; immutable-host/toolchain approval and toolchain qualification remain unavailable")
        }
    }
    project.tasks.register("clang1813AProfileLoaderSmoke") {
        dependsOn project.tasks.named("clang1813AProfileLoaderCompile")
        doLast {
            // Capturing ambient dependencies is not independent execution approval.
            // The production launcher must consume an approved immutable closure;
            // that authority is explicitly unavailable in immutable-host-environment.json.
            throw new GradleException("authenticated immutable-host loader execution unavailable; compile-only evidence is unqualified")
        }
    }
}
