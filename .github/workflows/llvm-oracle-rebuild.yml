name: LLVM oracle clean rebuild

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build the pinned LLVM toolchain image
        run: |
          docker buildx build \
            --no-cache \
            --platform linux/amd64 \
            --build-arg SOURCE_DATE_EPOCH=1779182222 \
            --load \
            --tag decomp-llvm-oracle-toolchain:22.1.6 \
            --file oracle/llvm/22.1.6/build-toolchain.Dockerfile \
            oracle/llvm/22.1.6
          docker image inspect --format '{{.Id}}' decomp-llvm-oracle-toolchain:22.1.6 \
            | tee "$RUNNER_TEMP/image-digest.txt"
      - name: Fetch and authenticate LLVM 22.1.6
        run: |
          ./gradlew --no-daemon fetchLlvmSourceArchive \
            --args="--lock oracle/llvm/22.1.6/source-lock.json --output $RUNNER_TEMP/source-cache"
          # The authenticated cache is private by default. This build container runs as
          # root with DAC_OVERRIDE dropped, so expose only the immutable archive and
          # directory traversal needed by its read-only bind mount.
          chmod 0444 "$RUNNER_TEMP/source-cache/llvm-project-22.1.6.src.tar.xz"
          chmod 0555 "$RUNNER_TEMP/source-cache"
          ./gradlew --no-daemon fetchLlvmReleaseArtifacts \
            --args="$RUNNER_TEMP/reference-oracle"
      - name: Build the monolithic Clang oracle pair
        run: |
          # The container intentionally drops every capability, including the
          # root-only DAC override. Make only these fresh, job-scoped mounts
          # writable before entering that sandbox.
          install -d -m 0777 "$RUNNER_TEMP/oracle-work" "$RUNNER_TEMP/oracle-output"
          docker run --rm \
            --platform linux/amd64 \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repository,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/source-cache,dst=/source-cache,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/oracle-work,dst=/oracle" \
            --mount "type=bind,src=$RUNNER_TEMP/oracle-output,dst=/output" \
            --env LC_ALL=C \
            --env TZ=UTC \
            --env SOURCE_DATE_EPOCH=1779182222 \
            decomp-llvm-oracle-toolchain:22.1.6 \
            bash -euxo pipefail -c '
              python3 /repository/scripts/capture-oracle-tools.py \
                --tool buildGenerator /usr/bin/ninja \
                --tool buildSystem /usr/bin/cmake \
                --tool compiler /usr/lib/llvm-22/bin/clang \
                --tool linker /usr/lib/llvm-22/bin/lld \
                --tool stripper /usr/lib/llvm-22/bin/llvm-objcopy \
                --version-command linker "[\"/usr/lib/llvm-22/bin/lld\", \"-flavor\", \"gnu\", \"--version\"]" \
                > /output/tool-records.json
              tar --extract --xz --file /source-cache/llvm-project-22.1.6.src.tar.xz --directory /oracle
              cmake -G Ninja \
                -S /oracle/llvm-project-22.1.6.src/llvm \
                -B /oracle/build \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DLLVM_ENABLE_PROJECTS=clang \
                -DLLVM_TARGETS_TO_BUILD=X86 \
                -DLLVM_INCLUDE_TESTS=OFF \
                -DCLANG_INCLUDE_TESTS=OFF \
                -DLLVM_INCLUDE_BENCHMARKS=OFF \
                -DLLVM_INCLUDE_EXAMPLES=OFF \
                -DLLVM_BUILD_EXAMPLES=OFF \
                -DLLVM_ENABLE_BINDINGS=OFF \
                -DLLVM_ENABLE_TERMINFO=OFF \
                -DLLVM_ENABLE_LIBXML2=OFF \
                -DLLVM_ENABLE_ZSTD=OFF \
                -DLLVM_ENABLE_CURL=OFF \
                -DLLVM_ENABLE_HTTPLIB=OFF \
                -DLLVM_ENABLE_LIBEDIT=OFF \
                -DLLVM_ENABLE_ASSERTIONS=OFF \
                -DLLVM_ENABLE_RTTI=OFF \
                -DCMAKE_C_COMPILER=/usr/lib/llvm-22/bin/clang \
                -DCMAKE_CXX_COMPILER=/usr/lib/llvm-22/bin/clang++ \
                -DCMAKE_AR=/usr/lib/llvm-22/bin/llvm-ar \
                -DCMAKE_RANLIB=/usr/lib/llvm-22/bin/llvm-ranlib \
                "-DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld -Wl,--build-id=sha1 -Wl,--compress-debug-sections=zlib" \
                "-DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld -Wl,--build-id=sha1 -Wl,--compress-debug-sections=zlib" \
                "-DCMAKE_C_FLAGS_RELWITHDEBINFO=-Oz -g2 -DNDEBUG -ffile-prefix-map=/oracle=/usr/src/llvm-oracle" \
                "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-Oz -g2 -DNDEBUG -ffile-prefix-map=/oracle=/usr/src/llvm-oracle"
              cmake --build /oracle/build --target clang -- -j4
              install -D -m 0755 \
                /oracle/build/bin/clang-22 /oracle/install/bin/clang-22
              install -m 0755 \
                /oracle/install/bin/clang-22 /output/clang-driver.full
              /usr/lib/llvm-22/bin/llvm-objcopy --strip-all \
                /output/clang-driver.full /output/clang-driver.stripped
            '
          sudo chown -R "$USER:$USER" "$RUNNER_TEMP/oracle-output"
          cp "$RUNNER_TEMP/image-digest.txt" "$RUNNER_TEMP/oracle-output/"
          sha256sum "$RUNNER_TEMP/oracle-output"/clang-driver.*
          stat --format='%n %s' "$RUNNER_TEMP/oracle-output"/clang-driver.*
      - name: Prove the clean rebuild matches the released oracle pair
        run: |
          cmp "$RUNNER_TEMP/oracle-output/clang-driver.full" \
            "$RUNNER_TEMP/reference-oracle/artifacts/clang-driver.full"
          cmp "$RUNNER_TEMP/oracle-output/clang-driver.stripped" \
            "$RUNNER_TEMP/reference-oracle/artifacts/clang-driver.stripped"
          LLVM_ORACLE_ARTIFACT_ROOT="$RUNNER_TEMP/reference-oracle" \
            ./gradlew --no-daemon verifyLlvmOracleArtifacts
      - uses: actions/upload-artifact@v7
        with:
          name: llvm-oracle-rebuild
          path: ${{ runner.temp }}/oracle-output
          compression-level: 0
          retention-days: 1
