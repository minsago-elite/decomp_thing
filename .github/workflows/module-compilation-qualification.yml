name: Contained module compilation

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      inventory-sha256:
        description: Exact compiled inventory of required tests executed in this workflow
        value: ${{ jobs.exact-module-runtime.outputs.inventory-sha256 }}

permissions:
  contents: read

concurrency:
  group: module-compilation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-module-runtime:
    outputs:
      inventory-sha256: ${{ steps.qualify.outputs.inventory-sha256 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/build/gradle-user-home
      TMPDIR: ${{ github.workspace }}/build/module-compilation-qualification/tmp
      XDG_CACHE_HOME: ${{ github.workspace }}/build/module-compilation-qualification/cache
      JAVA_TOOL_OPTIONS: -XX:-UsePerfData -Djava.io.tmpdir=${{ github.workspace }}/build/module-compilation-qualification/tmp -Djna.tmpdir=${{ github.workspace }}/build/module-compilation-qualification/tmp -Duser.home=${{ github.workspace }}/build/module-compilation-qualification/home
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 2
      - name: Prepare repository-owned temporary and cache paths
        run: mkdir -p "$TMPDIR" "$XDG_CACHE_HOME" "$GITHUB_WORKSPACE/build/module-compilation-qualification/runner-tmp" "$GITHUB_WORKSPACE/build/module-compilation-qualification/home"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/setup-gradle-compiler-cache
        with:
          cache-read-only: true
      - name: Install pinned frontend build toolchain
        run: |
          bash scripts/install-frontend-node.sh "$GITHUB_WORKSPACE/build/module-compilation-qualification/node"
          echo "$GITHUB_WORKSPACE/build/module-compilation-qualification/node/bin" >> "$GITHUB_PATH"
      - name: Install existing sandbox host prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 --error-on=any update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends bubblewrap binutils build-essential dbus-user-session e2fsprogs ca-certificates curl python3 systemd util-linux
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Verify fixed module scratch profile
        run: bash scripts/test-module-compile-ext4-scratch-profile.sh
      - name: Prepare existing root-owned Java and ABI runtime
        run: bash scripts/ci-prepare-oracle-runtime.sh
      - name: Prepare existing user-session sandbox services
        run: bash scripts/ci-prepare-acp-sandbox.sh
      - name: Prepare finite compiler and terminal-proof scratch
        env:
          RUNNER_TEMP: ${{ github.workspace }}/build/module-compilation-qualification/runner-tmp
        run: |
          env RUNNER_TEMP="$GITHUB_WORKSPACE/build/module-compilation-qualification/runner-tmp" bash scripts/ci-prepare-oracle-ext4-scratch.sh --module-compile
          env RUNNER_TEMP="$GITHUB_WORKSPACE/build/module-compilation-qualification/runner-tmp" bash scripts/ci-prepare-oracle-ext4-scratch.sh
      - name: Qualify exact modules and failure rollback through actual containment
        id: qualify
        run: |
          bash scripts/qualify-contained-module-compilation.sh
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import hashlib
          from pathlib import Path
          print('inventory-sha256=' + hashlib.sha256(Path('build/module-compilation-qualification/compiled-live-tests.json').read_bytes()).hexdigest())
          PYTHON
      - name: Release owned finite scratch mounts
        if: always()
        env:
          RUNNER_TEMP: ${{ github.workspace }}/build/module-compilation-qualification/runner-tmp
        run: |
          module_status=0
          terminal_status=0
          env RUNNER_TEMP="$GITHUB_WORKSPACE/build/module-compilation-qualification/runner-tmp" bash scripts/ci-release-oracle-ext4-scratch.sh --module-compile || module_status=$?
          env RUNNER_TEMP="$GITHUB_WORKSPACE/build/module-compilation-qualification/runner-tmp" bash scripts/ci-release-oracle-ext4-scratch.sh || terminal_status=$?
          python3 - "$module_status" "$terminal_status" <<'PYTHON'
          import json
          from pathlib import Path
          import sys
          output = Path('build/module-compilation-qualification/scratch-release.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          module, terminal = map(int, sys.argv[1:])
          with output.open('x', encoding='utf-8') as stream:
              json.dump({'schemaVersion': 1, 'moduleReleaseExitCode': module,
                         'terminalReleaseExitCode': terminal,
                         'bothReleaseCommandsSucceeded': module == terminal == 0}, stream, sort_keys=True)
              stream.write('\n')
          PYTHON
          if [[ "$module_status" != 0 || "$terminal_status" != 0 ]]; then
            echo 'At least one owned scratch release failed; retained release evidence does not establish complete cleanup.' >&2
            if [[ "$module_status" != 0 ]]; then exit "$module_status"; fi
            exit "$terminal_status"
          fi
      - name: Retain exact compiler and lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contained-module-compilation
          retention-days: 14
          if-no-files-found: error
          path: |
            build/module-compilation-qualification/operator-provisioning.json
            build/module-compilation-qualification/worker-classpath.json
            build/module-compilation-qualification/config
            build/module-compilation-qualification/test-summary.json
            build/module-compilation-qualification/compiled-live-tests.json
            build/module-compilation-qualification/child-classpath.json
            build/module-compilation-qualification/compiled-class-inventory.json
            build/module-compilation-qualification/checkout-provenance.json
            build/module-compilation-qualification/qualification-exit.json
            build/module-compilation-qualification/scratch-release.json
            build/module-compilation-qualification/live-gradle.log
            build/module-compilation-qualification/case-reconciliation.*
            build/module-compilation-qualification/operator-cleanup.*
            build/reports/contained-module-compilation-live
            build/verification/visibility-kotlin-generated-canaries.json
            build/test-results/moduleCompilationLiveQualification
            build/reports/tests/moduleCompilationLiveQualification
