name: Clang 18.1.3 generic-template toolchain qualification

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Choose the full acceptance run or metadata-only diagnostic
        type: choice
        required: true
        default: full-qualification
        options:
          - full-qualification
          - snapshot-metadata-diagnostic
  pull_request:
    paths:
      - '.github/workflows/generic-template-toolchain.yml'
      - 'oracle/clang/18.1.3/**'
      - 'oracle/llvm/22.1.6/release-artifacts.json'
      - 'oracle/llvm/22.1.6/oracle-manifest.json'
      - 'oracle/llvm/22.1.6/keys/douglas-yung-llvm-release.asc'
      - 'scripts/oracle/provision_clang_18_1_3.py'
      - 'scripts/oracle/clang_18_1_3_worker.py'
      - 'scripts/oracle/clang_18_1_3_transport.py'
      - 'scripts/oracle/clang_18_1_3_journal.py'
      - 'scripts/oracle/clang_18_1_3_loader_snapshot.py'
      - 'src/main/kotlin/decompengine/oracle/core/OracleArtifacts.kt'
      - 'src/main/kotlin/decompengine/oracle/core/OracleJson.kt'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradle/wrapper/**'
      - 'src/main/kotlin/decompengine/oracle/fulltree/FullTreeGenericTemplateFrontendProfileV1.kt'
  push:
    branches: [master]
    paths:
      - '.github/workflows/generic-template-toolchain.yml'
      - 'oracle/clang/18.1.3/**'
      - 'oracle/llvm/22.1.6/release-artifacts.json'
      - 'oracle/llvm/22.1.6/oracle-manifest.json'
      - 'oracle/llvm/22.1.6/keys/douglas-yung-llvm-release.asc'
      - 'scripts/oracle/provision_clang_18_1_3.py'
      - 'scripts/oracle/clang_18_1_3_worker.py'
      - 'scripts/oracle/clang_18_1_3_transport.py'
      - 'scripts/oracle/clang_18_1_3_journal.py'
      - 'scripts/oracle/clang_18_1_3_loader_snapshot.py'
      - 'src/main/kotlin/decompengine/oracle/core/OracleArtifacts.kt'
      - 'src/main/kotlin/decompengine/oracle/core/OracleJson.kt'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradle/wrapper/**'
      - 'src/main/kotlin/decompengine/oracle/fulltree/FullTreeGenericTemplateFrontendProfileV1.kt'

permissions:
  contents: read

concurrency:
  group: clang-18-1-3-toolchain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot-metadata:
    name: Production snapshot metadata diagnostic
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'snapshot-metadata-diagnostic' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LC_ALL: C
      TZ: UTC
      CLANG_WORK: ${{ github.workspace }}/build/clang1813
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify preinstalled Ubuntu archive verification tools
        run: |
          command -v gpgv
          python3 --version
          test -r /usr/share/keyrings/ubuntu-archive-keyring.gpg

      - name: Authenticate only the candidate Snapshot indexes and pinned package rows
        run: |
          python3 scripts/oracle/provision_clang_18_1_3.py probe-snapshot-metadata \
            --snapshot 20240702T000000Z \
            --output "$CLANG_WORK/snapshot-probe-20240702"

      - name: Print the authenticated metadata report for review
        run: cat "$CLANG_WORK/snapshot-probe-20240702/snapshot-metadata-report.json"

      - name: Upload candidate Snapshot metadata evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ubuntu-snapshot-20240702-metadata-only
          path: |
            ${{ github.workspace }}/build/clang1813/snapshot-probe-20240702/snapshot-metadata-report.json
            ${{ github.workspace }}/build/clang1813/snapshot-probe-20240702/signed-index-metadata/**
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1

  offline-validation:
    name: Offline provisioning validation and acquisition status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      acquisition_enabled: ${{ steps.acquisition_status.outputs.acquisition_enabled }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Report acquisition prerequisite without network requests
        id: acquisition_status
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          result = subprocess.run(
              [sys.executable, "scripts/oracle/provision_clang_18_1_3.py", "acquisition-status"],
              check=True, capture_output=True, text=True,
          )
          status = json.loads(result.stdout)
          if type(status["acquisitionEnabled"]) is not bool or status["qualified"] is not False:
              raise SystemExit("invalid acquisition prerequisite status")
          if status["acceptanceStatus"] != "incomplete":
              raise SystemExit("prerequisite status must not claim acceptance")
          expected = ("available", "not-run") if status["acquisitionEnabled"] else ("paused", "skipped")
          if (status["acquisitionStatus"], status["nativeQualification"]) != expected:
              raise SystemExit("inconsistent acquisition prerequisite status")
          print(result.stdout, end="")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"acquisition_enabled={str(status['acquisitionEnabled']).lower()}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Clang 18.1.3 acquisition prerequisite\n\n")
              summary.write(f"Native qualification: **{status['nativeQualification'].upper()}**. ")
              summary.write("Acceptance: **INCOMPLETE**; this status is not qualification evidence.\n\n")
              summary.write(status["reason"] + "\n\n")
              summary.write("Offline validation runs separately and must pass; it does not qualify a toolchain or image.\n")
          PY

      - name: Run offline fail-closed provisioning tests
        run: python3 -m unittest discover -s oracle/clang/18.1.3 -p 'test_*.py' -v

      - name: Verify inert root-owned archive preflight without acquisition
        run: python3 oracle/clang/18.1.3/test_provisioning.py --privilege-smoke sudo

  loader-compilation:
    name: Loader compilation only (acquisition remains paused)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HOME: ${{ github.workspace }}/build/clang1813-loader-ci/home
      GRADLE_USER_HOME: ${{ github.workspace }}/build/clang1813-loader-ci/gradle-home
      TMPDIR: ${{ github.workspace }}/build/clang1813-loader-ci/tmp
      TMP: ${{ github.workspace }}/build/clang1813-loader-ci/tmp
      TEMP: ${{ github.workspace }}/build/clang1813-loader-ci/tmp
      XDG_CACHE_HOME: ${{ github.workspace }}/build/clang1813-loader-ci/xdg-cache
      XDG_CONFIG_HOME: ${{ github.workspace }}/build/clang1813-loader-ci/xdg-config
      XDG_DATA_HOME: ${{ github.workspace }}/build/clang1813-loader-ci/xdg-data
      XDG_STATE_HOME: ${{ github.workspace }}/build/clang1813-loader-ci/xdg-state
      XDG_RUNTIME_DIR: ${{ github.workspace }}/build/clang1813-loader-ci/xdg-runtime
      JAVA_TOOL_OPTIONS: >-
        -Djava.io.tmpdir=${{ github.workspace }}/build/clang1813-loader-ci/tmp
        -Djna.tmpdir=${{ github.workspace }}/build/clang1813-loader-ci/tmp
        -Duser.home=${{ github.workspace }}/build/clang1813-loader-ci/home
        -Dkotlin.daemon.options=runFilesPath=${{ github.workspace }}/build/clang1813-loader-ci/kotlin-runfiles
        -XX:-UsePerfData
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Allocate repository-owned tool state before Java and Gradle setup
        shell: bash
        run: |
          install -d -m 0700 "$HOME" "$GRADLE_USER_HOME" "$TMPDIR" \
            "$XDG_CACHE_HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" \
            "$XDG_STATE_HOME" "$XDG_RUNTIME_DIR" \
            "$GITHUB_WORKSPACE/build/clang1813-loader-ci/kotlin-runfiles"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: Compile captured loader source and closed helper dependencies without target execution
        run: ./gradlew --no-daemon -Pkotlin.compiler.execution.strategy=in-process -I oracle/clang/18.1.3/clang1813-loader-smoke.init.gradle clang1813AProfileLoaderCompile

  qualify:
    name: Native toolchain qualification
    needs: offline-validation
    if: ${{ needs.offline-validation.result == 'success' && needs.offline-validation.outputs.acquisition_enabled == 'true' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'full-qualification') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LC_ALL: C
      TZ: UTC
      SOURCE_DATE_EPOCH: '1714003200'
      CLANG_WORK: ${{ github.workspace }}/build/clang1813
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Require independently approved immutable host execution
        run: python3 scripts/oracle/provision_clang_18_1_3.py check-host-execution

      - name: Authenticate Ubuntu Snapshot source and patch compatibility first
        run: |
          mkdir -p "$CLANG_WORK"
          python3 scripts/oracle/provision_clang_18_1_3.py acquire \
            --output "$CLANG_WORK/acquisition"

      - name: Install pinned frontend Node after source authentication
        run: bash scripts/install-frontend-node.sh "$CLANG_WORK/frontend-node"

      - name: Run the accepted A profile and provenance loader tests
        run: |
          ./gradlew --no-daemon -PfrontendNodeHome="$CLANG_WORK/frontend-node" test \
            --tests 'decompengine.oracle.fulltree.generictemplatefrontend.FullTreeGenericTemplateFrontendV1Test'

      - name: Execute the locked Clang 22.1.6 negative comparator
        run: |
          mkdir -p "$CLANG_WORK"
          ./gradlew --no-daemon -PfrontendNodeHome="$CLANG_WORK/frontend-node" fetchLlvmReleaseArtifacts \
            --args="--lock oracle/llvm/22.1.6/release-artifacts.json $CLANG_WORK/llvm22-artifacts"
          chmod 0555 "$CLANG_WORK/llvm22-artifacts/artifacts/clang-driver.full"
          python3 scripts/oracle/provision_clang_18_1_3.py negative-version-smoke \
            --compiler "$CLANG_WORK/llvm22-artifacts/artifacts/clang-driver.full" \
            --output "$CLANG_WORK/clang-22.1.6-negative-smoke.json"

      - name: Provision first clean toolchain rootfs
        run: |
          python3 scripts/oracle/provision_clang_18_1_3.py provision-rootfs \
            --acquisition "$CLANG_WORK/acquisition" \
            --rootfs "$CLANG_WORK/rootfs-run1" \
            --workdir "$CLANG_WORK/work" \
            --output "$CLANG_WORK/run1" --label run1 \
            --rootfs-tar-output "$CLANG_WORK/run1/clang-18.1.3-noble-amd64.rootfs.tar"

      - name: Provision second clean toolchain rootfs
        run: |
          python3 scripts/oracle/provision_clang_18_1_3.py provision-rootfs \
            --acquisition "$CLANG_WORK/acquisition" \
            --rootfs "$CLANG_WORK/rootfs-run2" \
            --workdir "$CLANG_WORK/work" \
            --output "$CLANG_WORK/run2" --label run2 --keep-rootfs

      - name: Require reproducible rootfs and immutable OCI image
        run: |
          python3 scripts/oracle/provision_clang_18_1_3.py compare-runs \
            --first "$CLANG_WORK/run1/build-record-fragment.json" \
            --second "$CLANG_WORK/run2/build-record-fragment.json" \
            --output "$CLANG_WORK/build-record.json"
          python3 scripts/oracle/provision_clang_18_1_3.py verify-record \
            --record "$CLANG_WORK/build-record.json" \
            --rootfs-tar "$CLANG_WORK/run1/clang-18.1.3-noble-amd64.rootfs.tar"
          python3 scripts/oracle/provision_clang_18_1_3.py verify-image \
            --record "$CLANG_WORK/build-record.json" \
            --oci-archive "$CLANG_WORK/run1/clang-18.1.3-noble-amd64.oci.tar"
          python3 scripts/oracle/provision_clang_18_1_3.py verify-image \
            --record "$CLANG_WORK/build-record.json" \
            --oci-archive "$CLANG_WORK/run2/clang-18.1.3-noble-amd64.oci.tar"
          cmp "$CLANG_WORK/run1/clang-18.1.3-noble-amd64.oci.tar" \
            "$CLANG_WORK/run2/clang-18.1.3-noble-amd64.oci.tar"

      - name: Exercise the real A profile, PATH, driver, and resource loaders
        run: |
          python3 scripts/oracle/provision_clang_18_1_3.py write-loader-input \
            --record "$CLANG_WORK/build-record.json" \
            --rootfs "$CLANG_WORK/rootfs-run2" \
            --output "$CLANG_WORK/a-loader-smoke.json"
          ./gradlew --no-daemon -PfrontendNodeHome="$CLANG_WORK/frontend-node" \
            --init-script oracle/clang/18.1.3/clang1813-loader-smoke.init.gradle \
            clang1813AProfileLoaderSmoke \
            -Pclang1813.loaderInput="$CLANG_WORK/a-loader-smoke.properties"

      - name: Package bounded provenance evidence
        run: |
          python3 scripts/oracle/provision_clang_18_1_3.py package-provenance \
            --acquisition "$CLANG_WORK/acquisition" \
            --record "$CLANG_WORK/build-record.json" \
            --rootfs "$CLANG_WORK/rootfs-run2" \
            --oci-archive "$CLANG_WORK/run2/clang-18.1.3-noble-amd64.oci.tar" \
            --probe-report "$CLANG_WORK/run2/probe-report.json" \
            --loader-report "$CLANG_WORK/a-loader-smoke.json" \
            --negative-compiler "$CLANG_WORK/llvm22-artifacts/artifacts/clang-driver.full" \
            --negative-report "$CLANG_WORK/clang-22.1.6-negative-smoke.json" \
            --output "$CLANG_WORK/clang-18.1.3-provenance.tar"
          rm -rf "$CLANG_WORK/llvm22-artifacts"
          sudo rm -rf "$CLANG_WORK/rootfs-run2"
          rm "$CLANG_WORK/run2/clang-18.1.3-noble-amd64.oci.tar"

      - name: Upload the immutable toolchain image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clang-18.1.3-noble-amd64-image
          path: ${{ github.workspace }}/build/clang1813/run1/clang-18.1.3-noble-amd64.oci.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload the record-verified rootfs for downstream extraction
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clang-18.1.3-noble-amd64-rootfs
          path: ${{ github.workspace }}/build/clang1813/run1/clang-18.1.3-noble-amd64.rootfs.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload short-lived build record and authenticated provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clang-18.1.3-noble-amd64-provenance
          path: ${{ github.workspace }}/build/clang1813/clang-18.1.3-provenance.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Preserve fail-closed source audit result
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clang-18.1.3-source-audit-failure
          path: |
            ${{ github.workspace }}/build/clang1813/acquisition/patch-audit.json
            ${{ github.workspace }}/build/clang1813/acquisition/acquisition-candidate.json
            ${{ github.workspace }}/build/clang1813/acquisition/source-selection-diagnostics.json
            oracle/clang/18.1.3/ACQUISITION_STATUS.md
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
