name: Clang 18.1.3 generic-template toolchain qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/generic-template-toolchain.yml'
      - 'oracle/clang/18.1.3/**'
      - 'scripts/oracle/provision_clang_18_1_3.py'
  push:
    branches: [master]
    paths:
      - '.github/workflows/generic-template-toolchain.yml'
      - 'oracle/clang/18.1.3/**'
      - 'scripts/oracle/provision_clang_18_1_3.py'

permissions:
  contents: read

concurrency:
  group: clang-18-1-3-toolchain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot-metadata:
    name: Probe candidate Ubuntu Snapshot metadata only
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LC_ALL: C
      TZ: UTC
      CLANG_WORK: ${{ github.workspace }}/build/clang1813
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify preinstalled Ubuntu archive verification tools
        run: |
          command -v gpgv
          python3 --version
          test -r /usr/share/keyrings/ubuntu-archive-keyring.gpg

      - name: Authenticate only the candidate Snapshot indexes and pinned package rows
        run: |
          python3 scripts/oracle/provision_clang_18_1_3.py probe-snapshot-metadata \
            --snapshot 20240615T000000Z \
            --output "$CLANG_WORK/snapshot-probe-20240615"

      - name: Upload candidate Snapshot metadata evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ubuntu-snapshot-20240615-metadata-only
          path: |
            ${{ github.workspace }}/build/clang1813/snapshot-probe-20240615/snapshot-metadata-report.json
            ${{ github.workspace }}/build/clang1813/snapshot-probe-20240615/signed-index-metadata/**
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1

  qualify:
    # PR and manual runs are restricted to the metadata-only candidate probe
    # until a reviewed signed-index result authorizes a profile change.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LC_ALL: C
      TZ: UTC
      SOURCE_DATE_EPOCH: '1714003200'
      CLANG_WORK: ${{ github.workspace }}/build/clang1813
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Install bounded host acquisition tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            debootstrap dpkg-dev gpgv gnupg ubuntu-keyring python3

      - name: Authenticate Ubuntu Snapshot source and patch compatibility first
        run: |
          mkdir -p "$CLANG_WORK"
          python3 scripts/oracle/provision_clang_18_1_3.py acquire \
            --output "$CLANG_WORK/acquisition"

      - name: Run offline fail-closed provisioning tests
        run: python3 -m unittest discover -s oracle/clang/18.1.3 -p 'test_*.py' -v

      - name: Run the accepted A profile and provenance loader tests
        run: |
          ./gradlew --no-daemon test \
            --tests 'decompengine.oracle.fulltree.generictemplatefrontend.FullTreeGenericTemplateFrontendV1Test'

      - name: Execute the locked Clang 22.1.6 negative comparator
        run: |
          mkdir -p "$CLANG_WORK"
          ./gradlew --no-daemon fetchLlvmReleaseArtifacts \
            --args="--lock oracle/llvm/22.1.6/release-artifacts.json $CLANG_WORK/llvm22-artifacts"
          chmod 0555 "$CLANG_WORK/llvm22-artifacts/artifacts/clang-driver.full"
          python3 scripts/oracle/provision_clang_18_1_3.py negative-version-smoke \
            --compiler "$CLANG_WORK/llvm22-artifacts/artifacts/clang-driver.full" \
            --output "$CLANG_WORK/clang-22.1.6-negative-smoke.json"
          rm -rf "$CLANG_WORK/llvm22-artifacts"

      - name: Provision first clean toolchain rootfs
        run: |
          python3 scripts/oracle/provision_clang_18_1_3.py provision-rootfs \
            --acquisition "$CLANG_WORK/acquisition" \
            --rootfs "$CLANG_WORK/rootfs-run1" \
            --workdir "$CLANG_WORK/work" \
            --output "$CLANG_WORK/run1" --label run1

      - name: Provision second clean toolchain rootfs
        run: |
          python3 scripts/oracle/provision_clang_18_1_3.py provision-rootfs \
            --acquisition "$CLANG_WORK/acquisition" \
            --rootfs "$CLANG_WORK/rootfs-run2" \
            --workdir "$CLANG_WORK/work" \
            --output "$CLANG_WORK/run2" --label run2 --keep-rootfs

      - name: Require reproducible rootfs and immutable OCI image
        run: |
          python3 scripts/oracle/provision_clang_18_1_3.py compare-runs \
            --first "$CLANG_WORK/run1/build-record-fragment.json" \
            --second "$CLANG_WORK/run2/build-record-fragment.json" \
            --output "$CLANG_WORK/build-record.json"
          python3 scripts/oracle/provision_clang_18_1_3.py verify-record \
            --record "$CLANG_WORK/build-record.json"
          python3 scripts/oracle/provision_clang_18_1_3.py verify-image \
            --record "$CLANG_WORK/build-record.json" \
            --oci-archive "$CLANG_WORK/run1/clang-18.1.3-noble-amd64.oci.tar"
          python3 scripts/oracle/provision_clang_18_1_3.py verify-image \
            --record "$CLANG_WORK/build-record.json" \
            --oci-archive "$CLANG_WORK/run2/clang-18.1.3-noble-amd64.oci.tar"
          cmp "$CLANG_WORK/run1/clang-18.1.3-noble-amd64.oci.tar" \
            "$CLANG_WORK/run2/clang-18.1.3-noble-amd64.oci.tar"
          rm "$CLANG_WORK/run2/clang-18.1.3-noble-amd64.oci.tar"

      - name: Exercise the real A profile, PATH, driver, and resource loaders
        run: |
          python3 scripts/oracle/provision_clang_18_1_3.py write-loader-input \
            --record "$CLANG_WORK/build-record.json" \
            --rootfs "$CLANG_WORK/rootfs-run2" \
            --output "$CLANG_WORK/a-loader-smoke.json"
          ./gradlew --no-daemon --init-script oracle/clang/18.1.3/clang1813-loader-smoke.init.gradle \
            clang1813AProfileLoaderSmoke \
            -Pclang1813.loaderInput="$CLANG_WORK/a-loader-smoke.properties"
          sudo rm -rf "$CLANG_WORK/rootfs-run2"

      - name: Package bounded provenance evidence
        run: |
          python3 scripts/oracle/provision_clang_18_1_3.py package-provenance \
            --acquisition "$CLANG_WORK/acquisition" \
            --record "$CLANG_WORK/build-record.json" \
            --probe-report "$CLANG_WORK/run2/probe-report.json" \
            --loader-report "$CLANG_WORK/a-loader-smoke.json" \
            --negative-report "$CLANG_WORK/clang-22.1.6-negative-smoke.json" \
            --output "$CLANG_WORK/clang-18.1.3-provenance.tar"

      - name: Upload the immutable toolchain image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clang-18.1.3-noble-amd64-image
          path: ${{ github.workspace }}/build/clang1813/run1/clang-18.1.3-noble-amd64.oci.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload short-lived build record and authenticated provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clang-18.1.3-noble-amd64-provenance
          path: ${{ github.workspace }}/build/clang1813/clang-18.1.3-provenance.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Preserve fail-closed source audit result
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clang-18.1.3-source-audit-failure
          path: |
            ${{ github.workspace }}/build/clang1813/acquisition/patch-audit.json
            ${{ github.workspace }}/build/clang1813/acquisition/acquisition-candidate.json
            ${{ github.workspace }}/build/clang1813/acquisition/source-selection-diagnostics.json
            oracle/clang/18.1.3/ACQUISITION_STATUS.md
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
