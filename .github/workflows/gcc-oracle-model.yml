name: GCC oracle model

on:
  push:
  pull_request:

jobs:
  provenance-and-elf-verifier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/oracle-generation.txt
      - name: Install pinned oracle-generation dependencies
        run: python3 -m pip install -r requirements/oracle-generation.txt
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils build-essential dbus-user-session gnupg uidmap
      - name: Verify source provenance metadata
        run: python3 scripts/verify-gcc-oracle-source.py --metadata-only
      - name: Fetch and fully verify the pinned source release
        run: python3 scripts/fetch-gcc-oracle-source.py "$RUNNER_TEMP/gcc-oracle-source"
      - name: Reproduce and verify the recorded toolchain image
        run: |
          echo '8b0af79ba3426f49ba599eb0c7eea433c62ac5bb6ab5e7797f7d09d978f43543  oracle/gcc/16.2.0/build-toolchain.Dockerfile' \
            | sha256sum --check --strict
          docker buildx build \
            --no-cache \
            --platform linux/amd64 \
            --build-arg SOURCE_DATE_EPOCH=1786060800 \
            --load \
            --tag decomp-gcc-oracle-toolchain:16.2.0 \
            --file oracle/gcc/16.2.0/build-toolchain.Dockerfile \
            oracle/gcc/16.2.0
          observed="$(docker image inspect --format '{{.Id}}' decomp-gcc-oracle-toolchain:16.2.0)"
          echo "recorded origin image: sha256:510c510f300d811df22c7769633575a94939073b529a73125bf96cfb96dc7248"
          echo "reproduced image: $observed"
          docker image inspect \
            decomp-gcc-oracle-toolchain:16.2.0 \
            | python3 scripts/verify-gcc-toolchain-reproduction.py \
                --lock oracle/gcc/16.2.0/toolchain-reproduction.json \
                --build-record oracle/gcc/16.2.0/build-record.json
          echo "GCC_TOOLCHAIN_IMAGE_ID=$observed" >> "$GITHUB_ENV"
          docker run --rm \
            --platform linux/amd64 \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,noexec \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/oracle,readonly" \
            --workdir /oracle \
            --entrypoint /usr/bin/python3 \
            "$observed" \
            scripts/verify-gcc-oracle-build-record.py \
            --source-lock oracle/gcc/16.2.0/source-lock.json \
            --build-record oracle/gcc/16.2.0/build-record.json \
            --container-digest "$observed" \
            --reproduction-lock oracle/gcc/16.2.0/toolchain-reproduction.json
      - name: Authenticate the behavior-corpus control client
        run: |
          install -d "$RUNNER_TEMP/docker-client"
          curl --fail --silent --show-error --location \
            https://download.docker.com/linux/static/stable/x86_64/docker-29.7.2.tgz \
            --output "$RUNNER_TEMP/docker-client/docker-29.7.2.tgz"
          echo "803d433f226db4776e1768fd319fc6c6e4935a456acf84fcc0080818b854bc8f  $RUNNER_TEMP/docker-client/docker-29.7.2.tgz" \
            | sha256sum --check --strict
          tar --extract --gzip \
            --file "$RUNNER_TEMP/docker-client/docker-29.7.2.tgz" \
            --directory "$RUNNER_TEMP/docker-client"
          echo "e45381109c685311cf84c5e33a1aca7da81d6b55c0f9aed74091fc08c3a94f13  $RUNNER_TEMP/docker-client/docker/docker" \
            | sha256sum --check --strict
          test "$(stat --format='%s' "$RUNNER_TEMP/docker-client/docker/docker")" = 42677472
          test "$("$RUNNER_TEMP/docker-client/docker/docker" --version)" = \
            'Docker version 29.7.2, build a7dcaa6'
      - name: Start the pinned rootless generic behavior executor
        run: |
          docker image save decomp-gcc-oracle-toolchain:16.2.0 \
            --output "$RUNNER_TEMP/gcc-oracle-image.tar"
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          runtime_directory="/run/user/$(id -u)"
          test -d "$runtime_directory"
          install -d -m 700 \
            "$RUNNER_TEMP/rootless-data" \
            "$RUNNER_TEMP/rootless-exec" \
            "$RUNNER_TEMP/rootless-state"
          export PATH="$RUNNER_TEMP/docker-client/docker:$PATH"
          export XDG_RUNTIME_DIR="$runtime_directory"
          export DOCKERD_ROOTLESS_ROOTLESSKIT_STATE_DIR="$RUNNER_TEMP/rootless-state"
          socket="$runtime_directory/decomp-behavior-docker.sock"
          dockerd-rootless.sh \
            --data-root="$RUNNER_TEMP/rootless-data" \
            --exec-root="$RUNNER_TEMP/rootless-exec" \
            --pidfile="$RUNNER_TEMP/rootless-dockerd.pid" \
            --host="unix://$socket" \
            --storage-driver=overlay2 \
            >"$RUNNER_TEMP/rootless-dockerd.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/rootless-wrapper.pid"
          ready=false
          for attempt in $(seq 1 60); do
            if DOCKER_HOST="unix://$socket" \
              "$RUNNER_TEMP/docker-client/docker/docker" info >/dev/null 2>&1; then
              ready=true
              break
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/rootless-wrapper.pid")" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if test "$ready" != true; then
            sed -n '1,240p' "$RUNNER_TEMP/rootless-dockerd.log"
            exit 1
          fi
          DOCKER_HOST="unix://$socket" \
            "$RUNNER_TEMP/docker-client/docker/docker" image load \
              --input "$RUNNER_TEMP/gcc-oracle-image.tar"
          observed="$(DOCKER_HOST="unix://$socket" \
            "$RUNNER_TEMP/docker-client/docker/docker" image inspect \
              --format '{{.Id}}' decomp-gcc-oracle-toolchain:16.2.0)"
          test "$observed" = "$GCC_TOOLCHAIN_IMAGE_ID"
          echo "DOCKER=$RUNNER_TEMP/docker-client/docker/docker" >> "$GITHUB_ENV"
          echo "DOCKER_HOST=unix://$socket" >> "$GITHUB_ENV"
      - name: Test oracle schemas and ELF twin verifier
        env:
          DOCKER: ${{ runner.temp }}/docker-client/docker/docker
        run: python3 -m unittest discover -s tests/oracle -v
      - name: Cross-check checked behavior corpus and evidence offline
        run: |
          python3 scripts/check-behavior-corpus-evidence.py \
            --corpus oracle/gcc/16.2.0/behavior-corpus.json \
            --evidence oracle/gcc/16.2.0/behavior-corpus-evidence.json
      - name: Verify checked executable behavior evidence
        run: |
          set +e
          python3 scripts/check-gcc-behavior-executor.py
          profile_status=$?
          set -e
          if test "$profile_status" = 0; then
            python3 scripts/run-gcc-behavior-corpus.py \
              --json-output "$RUNNER_TEMP/behavior-corpus-evidence.json"
            cmp "$RUNNER_TEMP/behavior-corpus-evidence.json" \
              oracle/gcc/16.2.0/behavior-corpus-evidence.json
          elif test "$profile_status" = 78; then
            echo '::notice title=GCC behavior evidence not reproduced::The hosted kernel/executor does not match the checked GCC benchmark profile; offline schema/provenance gates and live generic sandbox tests still ran.'
          else
            exit "$profile_status"
          fi
      - name: Verify checked-in production oracle pair
        run: python3 scripts/verify-gcc-oracle-artifacts.py oracle/gcc/16.2.0/oracle-manifest.json
      - name: Stop the isolated behavior executor
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/rootless-wrapper.pid"; then
            kill "$(cat "$RUNNER_TEMP/rootless-wrapper.pid")" 2>/dev/null || true
          fi
