name: GCC oracle model

on:
  push:
    branches: [master]
    tags: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        description: Manual GCC evidence capture
        type: choice
        options: [driver-dwarf-interfaces, cc1-runtime-diagnostics, cc1-full-export, cc1-native-calls, cc1-analysis-throughput, cc1-engine-cli]
        default: driver-dwarf-interfaces

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pull-request' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cc1-runtime-diagnostics:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'cc1-runtime-diagnostics'
    uses: ./.github/workflows/gcc-cc1-full-export.yml
    permissions:
      contents: read
    with:
      capture-mode: cc1-runtime-diagnostics

  cc1-full-export:
    # Manual qualification-mode full export (retains the profile-bound model and receipts), for branches that cannot
    # form a mergeable labelled pull request.
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'cc1-full-export'
    uses: ./.github/workflows/gcc-cc1-full-export.yml
    permissions:
      contents: read
    with:
      capture-mode: cc1-full-export

  cc1-native-calls:
    # Manual #1494 collection: contained cc1 native-call observations through the installed gcc-engine-native-calls CLI.
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'cc1-native-calls'
    uses: ./.github/workflows/gcc-cc1-full-export.yml
    permissions:
      contents: read
    with:
      capture-mode: cc1-native-calls

  cc1-engine-cli:
    # Manual #927 collection: installed gcc-engine-plan fresh run versus a forced interruption and same-journal resume.
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'cc1-engine-cli'
    uses: ./.github/workflows/gcc-cc1-full-export.yml
    permissions:
      contents: read
    with:
      capture-mode: cc1-engine-cli

  cc1-analysis-throughput:
    # Diagnostic-only #1444 measurement: Ghidra auto-analysis wall time and recovered-function census per analyzer
    # selection on the verified cc1 binary. It produces no model, receipt or qualification evidence.
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'cc1-analysis-throughput'
    name: cc1 analysis ${{ matrix.variant.name }}
    strategy:
      fail-fast: false
      matrix:
        variant:
          - {name: baseline, disable: ''}
          - {name: no-switch, disable: 'Decompiler Switch Analysis,Decompiler Switch Analysis - One Time'}
          - {name: no-call-convention, disable: 'Call Convention ID'}
          - {name: no-switch-no-call-convention, disable: 'Decompiler Switch Analysis,Decompiler Switch Analysis - One Time,Call Convention ID'}
          - {name: lean, disable: 'Decompiler Switch Analysis,Decompiler Switch Analysis - One Time,Call Convention ID,Stack,x86 Constant Reference Analyzer'}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install the pinned build-only frontend toolchain
        run: |
          bash scripts/install-frontend-node.sh "$RUNNER_TEMP/frontend-node"
          echo "$RUNNER_TEMP/frontend-node/bin" >> "$GITHUB_PATH"
      - name: Restore the manifest-keyed cc1 artifact pair
        id: cc1-artifact-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/gcc-cc1-engine/artifacts
          key: gcc-cc1-artifacts-v2-${{ hashFiles('oracle/gcc/16.2.0/source-lock.json', 'oracle/gcc/16.2.0/build-record.json', 'oracle/gcc/16.2.0/toolchain-reproduction.json', 'oracle/gcc/16.2.0/build-toolchain.Dockerfile', 'oracle/gcc/16.2.0/cc1-build-record.json', 'oracle/gcc/16.2.0/cc1-oracle-manifest.json') }}-lookup
          restore-keys: |
            gcc-cc1-artifacts-v2-${{ hashFiles('oracle/gcc/16.2.0/source-lock.json', 'oracle/gcc/16.2.0/build-record.json', 'oracle/gcc/16.2.0/toolchain-reproduction.json', 'oracle/gcc/16.2.0/build-toolchain.Dockerfile', 'oracle/gcc/16.2.0/cc1-build-record.json', 'oracle/gcc/16.2.0/cc1-oracle-manifest.json') }}
      - name: Require the cached cc1 pair
        run: |
          test -n "${{ steps.cc1-artifact-cache.outputs.cache-matched-key }}" || { echo 'no cached cc1 pair; run cc1-runtime-diagnostics once to populate it' >&2; exit 1; }
          sha256sum "$RUNNER_TEMP/gcc-cc1-engine/artifacts/gcc-cc1.stripped"
          grep -F "$(sha256sum "$RUNNER_TEMP/gcc-cc1-engine/artifacts/gcc-cc1.stripped" | cut -d' ' -f1)" oracle/gcc/16.2.0/cc1-oracle-manifest.json >/dev/null
      - name: Stage the bundled Ghidra distribution
        run: ./gradlew --no-daemon installDist
      - name: Run Ghidra auto-analysis with the selected analyzers (diagnostic-only)
        env:
          DISABLE: ${{ matrix.variant.disable }}
        run: |
          ghidra="$(echo "$PWD"/build/install/llm_bin_patch/libexec/ghidra/ghidra_*_PUBLIC)"
          project="$RUNNER_TEMP/analysis-project"; mkdir -p "$project" build/analysis-experiment
          start=$(date +%s)
          JAVA_TOOL_OPTIONS="-Dcpu.core.override=4" "$ghidra/support/analyzeHeadless" "$project" experiment \
            -import "$RUNNER_TEMP/gcc-cc1-engine/artifacts/gcc-cc1.stripped" \
            -scriptPath "$PWD/scripts/ghidra-analysis-experiment" \
            -preScript DisableAnalyzers.java ${DISABLE:+"$DISABLE"} \
            -postScript FunctionCensus.java \
            2>&1 | tee build/analysis-experiment/headless.log
          end=$(date +%s)
          {
            echo "### ${{ matrix.variant.name }}"
            echo "wall seconds: $((end - start))"
            grep -E 'Total Time' build/analysis-experiment/headless.log || true
            grep -E 'ANALYZER-EXPERIMENT' build/analysis-experiment/headless.log || true
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cc1-analysis-${{ matrix.variant.name }}-${{ github.run_id }}
          path: build/analysis-experiment/headless.log

  provenance-and-elf-verifier:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/oracle-generation.txt
      - name: Install pinned oracle-generation dependencies
        run: python3 -m pip install -r requirements/oracle-generation.txt
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            apparmor binutils build-essential dbus-user-session gnupg \
            slirp4netns=1.2.1-1build2 uidmap
      - name: Verify source provenance metadata
        run: python3 scripts/verify-gcc-oracle-source.py --metadata-only
      - name: Initialize private GCC builder workspace
        run: bash scripts/ci-gcc-toolchain-builder.sh init
      - name: Restore locked GCC source artifacts
        id: gcc-source-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ github.workspace }}/build/gcc-toolchain-reproduction/${{ github.run_id }}-${{ github.run_attempt }}/source/gcc-16.2.0.tar.xz
            ${{ github.workspace }}/build/gcc-toolchain-reproduction/${{ github.run_id }}-${{ github.run_attempt }}/source/gcc-16.2.0.tar.xz.sig
          key: gcc-source-v1-${{ runner.os }}-${{ hashFiles('oracle/gcc/16.2.0/source-lock.json') }}
      - name: Fetch and fully verify the pinned source release
        run: python3 scripts/fetch-gcc-oracle-source.py "$GITHUB_WORKSPACE/build/gcc-toolchain-reproduction/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/source"
      - name: Save authenticated GCC source artifacts
        if: steps.gcc-source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ github.workspace }}/build/gcc-toolchain-reproduction/${{ github.run_id }}-${{ github.run_attempt }}/source/gcc-16.2.0.tar.xz
            ${{ github.workspace }}/build/gcc-toolchain-reproduction/${{ github.run_id }}-${{ github.run_attempt }}/source/gcc-16.2.0.tar.xz.sig
          key: ${{ steps.gcc-source-cache.outputs.cache-primary-key }}
      - name: Run GCC builder command and archive controls
        env:
          TMPDIR: ${{ github.workspace }}/build/gcc-toolchain-reproduction/${{ github.run_id }}-${{ github.run_attempt }}/tmp
        run: |
          install -d -m 700 "$TMPDIR"
          python3 -m unittest tests.oracle.test_gcc_toolchain_builder -v
      - name: Authenticate the pinned Docker executor and BuildKit bundle
        run: bash scripts/ci-gcc-toolchain-builder.sh authenticate
      - name: Start the owned rootless behavior executor
        run: bash scripts/ci-gcc-toolchain-builder.sh start-rootless
      - name: Reproduce and verify the recorded toolchain image
        run: bash scripts/ci-gcc-toolchain-builder.sh reproduce
      - name: Fetch recorded component source objects for offline regression controls
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          manifests = [Path("oracle/gcc/16.2.0") / kind / "evidence.json"
                       for kind in ("machine-call-component-v1", "external-call-component-v1")]
          commits = sorted({json.loads(path.read_bytes())["source"]["commit"] for path in manifests})
          subprocess.run(["git", "fetch", "--no-tags", "--depth=1", "origin", *commits], check=True)
          PY
      - name: Test oracle schemas and ELF twin verifier
        env:
          TMPDIR: ${{ github.workspace }}/build/gcc-toolchain-reproduction/${{ github.run_id }}-${{ github.run_attempt }}/tmp
        run: |
          oracle_tests=()
          for path in tests/oracle/test_*.py; do
            # Retained for local legacy-compatibility runs; Kotlin/JVM owns these required gates.
            if [[ "$path" == "tests/oracle/test_release_artifacts.py" ||
                  "$path" == "tests/oracle/test_stable_toolchain_reproduction.py" ]]; then
              continue
            fi
            module="${path%.py}"
            oracle_tests+=("${module//\//.}")
          done
          python3 -m unittest "${oracle_tests[@]}" -v
      - name: Cross-check checked behavior corpus and evidence offline
        run: |
          python3 scripts/check-behavior-corpus-evidence.py \
            --corpus oracle/gcc/16.2.0/behavior-corpus.json \
            --evidence oracle/gcc/16.2.0/behavior-corpus-evidence.json
      - name: Verify checked executable behavior evidence
        env:
          TMPDIR: ${{ github.workspace }}/build/gcc-toolchain-reproduction/${{ github.run_id }}-${{ github.run_attempt }}/tmp
        run: |
          set +e
          python3 scripts/check-gcc-behavior-executor.py
          profile_status=$?
          set -e
          if test "$profile_status" = 0; then
            python3 scripts/run-gcc-behavior-corpus.py \
              --json-output "$GITHUB_WORKSPACE/build/gcc-toolchain-reproduction/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/evidence/behavior-corpus-evidence.json"
            cmp "$GITHUB_WORKSPACE/build/gcc-toolchain-reproduction/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/evidence/behavior-corpus-evidence.json" \
              oracle/gcc/16.2.0/behavior-corpus-evidence.json
          elif test "$profile_status" = 78; then
            echo '::notice title=GCC behavior evidence not reproduced::The hosted kernel/executor does not match the checked GCC benchmark profile; offline schema/provenance gates and live generic sandbox tests still ran.'
          else
            exit "$profile_status"
          fi
      - name: Verify checked-in production oracle pair
        run: python3 scripts/verify-gcc-oracle-artifacts.py oracle/gcc/16.2.0/oracle-manifest.json
      - name: Capture diagnostics and stop owned GCC services
        if: always()
        timeout-minutes: 5
        env:
          PRIMARY_STATUS: ${{ job.status }}
        run: |
          set +e
          bash scripts/ci-gcc-toolchain-builder.sh diagnostics
          diagnostics_status=$?
          bash scripts/ci-gcc-toolchain-builder.sh cleanup
          cleanup_status=$?
          test "$diagnostics_status" = 0 && test "$cleanup_status" = 0
      - name: Retain GCC toolchain reproduction diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gcc-toolchain-reproduction-diagnostics
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/gcc-toolchain-reproduction/*/owner.txt
            build/gcc-toolchain-reproduction/*/evidence

  driver-dwarf-interfaces:
    name: Retained GCC driver DWARF interfaces
    if: (github.event_name == 'workflow_dispatch' && inputs.operation == 'driver-dwarf-interfaces') || contains(github.event.pull_request.labels.*.name, 'qualify:driver-dwarf-interfaces')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      DECOMP_REQUIRE_GCC_DWARF_INTERFACES: 'true'
      DECOMP_GCC_DWARF_EVIDENCE_ROOT: ${{ github.workspace }}/build/gcc-driver-dwarf-interfaces
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/setup-gradle-compiler-cache
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: Install pinned build-only frontend toolchain
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          bash scripts/install-frontend-node.sh "$GITHUB_WORKSPACE/build/frontend-node"
          echo "$GITHUB_WORKSPACE/build/frontend-node/bin" >> "$GITHUB_PATH"
      - name: Capture and replay retained driver interface facts
        run: |
          mkdir -p build/gcc-driver-dwarf-interfaces
          git rev-parse HEAD > build/gcc-driver-dwarf-interfaces/source-revision.txt
          ./gradlew --no-daemon test \
            --tests 'decompengine.oracle.fulltree.BoundedDwarf*Test' \
            --tests 'decompengine.oracle.fulltree.FullTreeElfObjectLayoutTest' \
            --tests 'decompengine.oracle.structural.DwarfSysvAmd64*Test' \
            --tests 'decompengine.oracle.gcc.GccDriverDwarf*Test'
      - name: Retain interface facts and verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gcc-driver-dwarf-interfaces
          retention-days: 14
          if-no-files-found: error
          path: |
            build/gcc-driver-dwarf-interfaces
            build/reports/tests/test
            build/test-results/test
            build/reports/junit-signatures

  preprocessing-reference:
    name: Real GCC preprocessing and dependency references
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'qualify:preprocessing-reference')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Pull the pinned official GCC 16.2.0 base image
        run: docker pull --platform linux/amd64 docker.io/library/gcc@sha256:2e6f4ae27ab8ad6f9617b46f0468889d368fdd91f2ea29aff98e4d5d1a3637f0
      - name: Re-capture and compare checked-in references
        run: python3 scripts/capture-gcc-preprocessing-reference.py --runtime docker --check
