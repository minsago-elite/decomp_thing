name: Built-in core contract

on:
  push:
    branches: [master]
    tags: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  builtin-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install pinned build-only frontend toolchain
        run: |
          bash scripts/install-frontend-node.sh "$RUNNER_TEMP/frontend-node"
          echo "$RUNNER_TEMP/frontend-node/bin" >> "$GITHUB_PATH"
      - name: Install shared sandbox prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap binutils build-essential dbus-user-session systemd util-linux python3
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind /usr /usr --ro-bind /lib /lib --ro-bind /lib64 /lib64 /usr/bin/true
      - name: Prepare required ACP sandbox host
        run: scripts/ci-prepare-acp-sandbox.sh
      - name: Qualify required built-in core fixtures without skips
        run: python3 scripts/validate-builtin-contract.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: builtin-core-contract
          path: |
            build/builtin-contract-qualification
            build/test-results/test
            build/reports/tests/test
