name: Browser engine qualification

# Cross-engine packaged smoke and audit (#631, #1791). Dispatched explicitly: it builds the
# distribution and installs Firefox and WebKit with their host dependencies, which is too costly
# for every pull request. Each run's report.json records the engine and Playwright versions.
on:
  workflow_dispatch:
    inputs:
      engines:
        description: Space-separated Playwright engines (firefox, webkit, chromium)
        required: true
        default: firefox webkit

permissions:
  contents: read

jobs:
  engines:
    name: Packaged journeys in ${{ inputs.engines }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/build/npm-download-cache
      PLAYWRIGHT_CORE_VERSION: 1.58.2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: ./.github/actions/setup-gradle-compiler-cache
        with:
          cache-read-only: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/oracle-generation.txt
      - name: Install build-time Python requirements
        run: python3 -m pip install --requirement requirements/oracle-generation.txt
      - name: Cache reviewed frontend Node downloads
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/build/frontend-node-downloads
          key: frontend-node-archives-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-frontend-node.sh', 'scripts/frontend-node-sha256.txt', '.node-version', 'frontend/package.json') }}
      - name: Install pinned frontend toolchain
        env:
          DECOMP_FRONTEND_NODE_DOWNLOAD_CACHE: '1'
        run: |
          bash scripts/install-frontend-node.sh "$RUNNER_TEMP/frontend-node"
          echo "$RUNNER_TEMP/frontend-node/bin" >> "$GITHUB_PATH"
      - name: Validate requested engines
        env:
          ENGINES: ${{ inputs.engines }}
        run: |
          for engine in $ENGINES; do
            case "$engine" in firefox|webkit|chromium) ;; *) echo "Unsupported engine: $engine" >&2; exit 1 ;; esac
          done
      - name: Install test-only Playwright and browsers with host dependencies
        env:
          ENGINES: ${{ inputs.engines }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund --no-save "playwright-core@$PLAYWRIGHT_CORE_VERSION"
          # shellcheck disable=SC2086
          sudo --preserve-env=PLAYWRIGHT_BROWSERS_PATH "$(command -v node)" "$RUNNER_TEMP/pw/node_modules/playwright-core/cli.js" install-deps $ENGINES
          # shellcheck disable=SC2086
          node "$RUNNER_TEMP/pw/node_modules/playwright-core/cli.js" install $ENGINES
      - name: Build the packaged distribution
        run: |
          ./gradlew --no-daemon distZip
          web_distribution=("$GITHUB_WORKSPACE"/build/distributions/*.zip)
          test "${#web_distribution[@]}" -eq 1
          echo "WEB_TEST_ARCHIVE=${web_distribution[0]}" >> "$GITHUB_ENV"
      - name: Run the packaged smoke and audit in each engine
        env:
          ENGINES: ${{ inputs.engines }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
        run: |
          status=0
          for engine in $ENGINES; do
            node scripts/packaged-browser-engines.mjs --engine "$engine" --archive "$WEB_TEST_ARCHIVE" \
              --java-home "$JAVA_HOME" --python "$(command -v python3)" \
              --playwright "$RUNNER_TEMP/pw/node_modules/playwright-core" --work-parent "$GITHUB_WORKSPACE/build" || status=1
          done
          exit "$status"
      - name: Retain engine reports and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-engine-qualification
          retention-days: 30
          if-no-files-found: warn
          path: build/packaged-engines-*/
