name: CI

on:
  push:
  pull_request:

jobs:
  kotlin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install sandbox host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bubblewrap \
            binutils \
            build-essential \
            dbus-user-session \
            python3 \
            systemd \
            util-linux
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind /usr /usr --ro-bind /lib /lib --ro-bind /lib64 /lib64 /usr/bin/true
      - name: Prepare required live ACP sandbox host
        run: scripts/ci-prepare-acp-sandbox.sh
      - name: Run JVM and Kotlin checks
        run: scripts/ci.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kotlin-test-reports
          path: |
            build/reports/tests/test
            build/test-results/test

  archival-ghidra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - run: scripts/validate-archival-docker.sh

  clang:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install pinned LLVM and Clang toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18 make
          /usr/bin/clang-18 --version
          /usr/bin/llvm-config-18 --version
      - name: Run strict Clang and sanitizer compatibility checks
        env:
          DECOMP_TEST_CLANG: /usr/bin/clang-18
        run: scripts/validate-clang.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: clang-test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
