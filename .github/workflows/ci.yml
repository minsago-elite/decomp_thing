name: CI

on:
  push:
  pull_request:

jobs:
  kotlin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap binutils build-essential
      - run: scripts/ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kotlin-test-reports
          path: |
            build/reports/tests/test
            build/test-results/test

  archival-ghidra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - run: scripts/validate-archival-docker.sh
