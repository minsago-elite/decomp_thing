name: CI

on:
  push:
    branches: [master]
    tags: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pull-request' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/build/npm-download-cache
    name: Frontend contracts and bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Cache reviewed frontend Node downloads
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/build/frontend-node-downloads
          key: frontend-node-archives-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-frontend-node.sh', 'scripts/frontend-node-sha256.txt', '.node-version', 'frontend/package.json') }}
      - name: Install pinned build-only frontend toolchain
        env:
          DECOMP_FRONTEND_NODE_DOWNLOAD_CACHE: '1'
        run: |
          bash scripts/install-frontend-node.sh "$RUNNER_TEMP/frontend-node"
          echo "$RUNNER_TEMP/frontend-node/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/oracle-generation.txt
      - name: Check reconstruction neutrality before dependent builds
        run: python3 -B scripts/check-generic-leakage.py
      - name: Cache locked frontend package downloads
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/build/npm-download-cache/_cacache
          key: frontend-npm-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/package-lock.json', 'frontend/package.json', 'frontend/.npmrc', '.node-version', 'scripts/install-frontend-node.sh', 'scripts/frontend-node-sha256.txt') }}
      - name: Record toolchain and install locked dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/frontend-ci"
          {
            printf 'Source revision: %s\n' "$GITHUB_SHA"
            node --version
            npm --version
            python3 --version
            sha256sum frontend/package-lock.json contracts/web/v1/contract.schema.json
          } > "$RUNNER_TEMP/frontend-ci/toolchain.txt"
          npm --prefix frontend ci --ignore-scripts --no-audit --no-fund
          python3 -m pip install --requirement requirements/oracle-generation.txt
      - name: Verify packaged upgrade and cache evidence controls
        run: |
          node scripts/test-packaged-browser-upgrade.mjs
          node --check scripts/packaged-browser-upgrade-provenance.mjs
          node --test scripts/test-packaged-browser-upgrade-provenance.mjs
      - name: Verify packaged accessibility and asset audit controls
        run: |
          node scripts/test-packaged-browser-audit.mjs
          node scripts/test-browser-engine-input.mjs
          node scripts/test-packaged-browser-engine-adapter.mjs
          node --check scripts/packaged-browser-engines.mjs
      - name: Verify packaged upload route readiness controls
        run: node scripts/test-packaged-browser-upload.mjs
      - name: Verify bounded archival cleanup controls
        timeout-minutes: 1
        run: python3 -B scripts/test-archival-diagnostics.py --verbose
      - name: Verify bounded sanitizer invocation controls
        timeout-minutes: 1
        run: python3 -B scripts/test-clang-sanitizer.py --verbose
      - name: Validate versioned web contract fixtures
        run: python3 contracts/web/v1/verify.py | tee "$RUNNER_TEMP/frontend-ci/contracts.txt"
      - name: Validate ACP required-case metadata controls
        timeout-minutes: 1
        run: |
          python3 -B contracts/acp/v1/verify.py definition
          python3 -B scripts/test-acp-release-manifest.py --verbose
      - name: Verify API drift and legacy callback controls
        run: |
          node scripts/generate-web-api.mjs --check
          node --test scripts/generate-web-api.test.mjs scripts/legacy-session.test.mjs \
            | tee "$RUNNER_TEMP/frontend-ci/api-drift-tests.txt"
      - name: Verify generated large web fixtures
        run: node --test scripts/web-scale-fixtures.test.mjs | tee "$RUNNER_TEMP/frontend-ci/scale-fixtures-tests.txt"
      - name: Check frontend freshness diagnostic controls
        timeout-minutes: 1
        run: python3 -B scripts/test-frontend-freshness.py --verbose
      - name: Type-check frontend source and tests
        run: npm --prefix frontend run typecheck
      - name: Lint frontend source and tests
        run: npm --prefix frontend run lint
      - name: Run frontend component and state tests
        run: |
          npm --prefix frontend test -- --reporter=default --reporter=junit \
            --outputFile.junit="$RUNNER_TEMP/frontend-ci/component-tests.xml"
      - name: Verify isolated Git and GitHub fixtures
        run: node --test scripts/web-git-fixtures.test.mjs scripts/web-github-fixture-http.test.mjs | tee "$RUNNER_TEMP/frontend-ci/git-fixtures-tests.txt"
      - name: Build and verify the production asset inventory
        run: |
          npm --prefix frontend run build
          frontend_version="$(node -p "require('./frontend/package.json').version")"
          node scripts/web-asset-manifest.mjs build/frontend/dist "$frontend_version" \
            --write "$RUNNER_TEMP/frontend-ci/asset-manifest.json"
          node scripts/web-asset-manifest.mjs build/frontend/dist "$frontend_version" \
            --verify "$RUNNER_TEMP/frontend-ci/asset-manifest.json"
          node --test scripts/web-asset-manifest.test.mjs \
            | tee "$RUNNER_TEMP/frontend-ci/manifest-tests.txt"
          git diff --exit-code -- frontend/ contracts/web/v1/
      - name: Retain frontend verification evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-verification
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/frontend-ci
            build/frontend/bundle-report.json
            build/frontend/bundle-composition.json

  web-upgrade-previous:
    needs: frontend
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/build/npm-download-cache
    name: Build pinned previous web package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: ./.github/actions/setup-gradle-compiler-cache
        with:
          # Never publish outputs compiled from the older pinned source under this run's current-source key.
          cache-read-only: true
      - name: Cache locked frontend package downloads
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/build/npm-download-cache/_cacache
          key: frontend-npm-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/package-lock.json', 'frontend/package.json', 'frontend/.npmrc', '.node-version', 'scripts/install-frontend-node.sh', 'scripts/frontend-node-sha256.txt') }}
      - name: Cache reviewed frontend Node downloads
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/build/frontend-node-downloads
          key: frontend-node-archives-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-frontend-node.sh', 'scripts/frontend-node-sha256.txt', '.node-version', 'frontend/package.json') }}
      - name: Install pinned build Node and resolve the previous-source pin
        env:
          DECOMP_FRONTEND_NODE_DOWNLOAD_CACHE: '1'
        run: |
          bash scripts/install-frontend-node.sh "$RUNNER_TEMP/frontend-node"
          echo "$RUNNER_TEMP/frontend-node/bin" >> "$GITHUB_PATH"
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          pin = json.loads(Path('scripts/packaged-browser-upgrade-pin.json').read_text())
          assert pin['schema'] == 'packaged-upgrade-source-pin/v1'
          assert pin['repository'] == 'minsago-elite/decomp_thing'
          print(f"PREVIOUS_SOURCE_COMMIT={pin['commit']}")
          print(f"PREVIOUS_SOURCE_TREE={pin['tree']}")
          PY
      - name: Check out the immutable prior source tree
        run: |
          git fetch --no-tags --depth=1 origin "$PREVIOUS_SOURCE_COMMIT"
          git checkout --detach "$PREVIOUS_SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$PREVIOUS_SOURCE_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$PREVIOUS_SOURCE_TREE"
          test -z "$(git status --porcelain=v1)"
      - name: Build the complete prior distribution from its pinned source
        env:
          DECOMP_BROWSER_JS_RUNTIME: ${{ runner.temp }}/frontend-node/bin/node
        run: |
          ./gradlew --no-daemon installDist distZip verifyPackagedWeb
          previous_archives=(build/distributions/*.zip)
          test "${#previous_archives[@]}" -eq 1
          mkdir -p build/pinned-upgrade-previous
          cp "${previous_archives[0]}" build/pinned-upgrade-previous/previous-package.zip
          test -s build/pinned-upgrade-previous/previous-package.zip
          archive_sha256="$(sha256sum build/pinned-upgrade-previous/previous-package.zip | cut -d ' ' -f 1)"
          archive_bytes="$(stat -c '%s' build/pinned-upgrade-previous/previous-package.zip)"
          gradle_output="$(./gradlew --version --console=plain)"
          gradle_version="$(sed -n 's/^Gradle //p' <<< "$gradle_output" | sed -n '1p')"
          java_version="$(java -version 2>&1 | sed -n '1p')"
          node_version="$(node --version | sed 's/^v//')"
          python3 - "$PREVIOUS_SOURCE_COMMIT" "$PREVIOUS_SOURCE_TREE" "$archive_sha256" "$archive_bytes" "$gradle_version" "$java_version" "$node_version" <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          commit, tree, archive_sha256, archive_bytes, gradle, java, node = sys.argv[1:]
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == commit
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip() == tree
          assert subprocess.check_output(['git', 'status', '--porcelain=v1'], text=True) == ''
          record = {
              'schema': 'packaged-previous-build/v1',
              'repository': 'minsago-elite/decomp_thing',
              'commit': commit,
              'tree': tree,
              'cleanSource': True,
              'build': {
                  'workflow': 'CI',
                  'runId': os.environ['GITHUB_RUN_ID'],
                  'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
                  'gradleVersion': gradle,
                  'javaVersion': java,
                  'nodeVersion': node,
              },
              'archive': {
                  'file': 'previous-package.zip',
                  'sha256': archive_sha256,
                  'bytes': int(archive_bytes),
              },
          }
          assert gradle and java and node
          Path('build/pinned-upgrade-previous/previous-source.json').write_text(
              json.dumps(record, indent=2, sort_keys=True) + '\n'
          )
          PY
      - name: Retain pinned previous package and build provenance
        uses: actions/upload-artifact@v7
        with:
          name: packaged-web-pinned-previous
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: build/pinned-upgrade-previous

  web-packaged-build:
    needs: frontend
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/build/npm-download-cache
    name: Packaged web build and primary browser journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: ./.github/actions/setup-gradle-compiler-cache
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: Cache locked frontend package downloads
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/build/npm-download-cache/_cacache
          key: frontend-npm-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/package-lock.json', 'frontend/package.json', 'frontend/.npmrc', '.node-version', 'scripts/install-frontend-node.sh', 'scripts/frontend-node-sha256.txt') }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/oracle-generation.txt
      - name: Cache reviewed frontend Node downloads
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/build/frontend-node-downloads
          key: frontend-node-archives-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-frontend-node.sh', 'scripts/frontend-node-sha256.txt', '.node-version', 'frontend/package.json') }}
      - name: Install pinned build and browser tools
        env:
          DECOMP_FRONTEND_NODE_DOWNLOAD_CACHE: '1'
        run: |
          bash scripts/install-frontend-node.sh "$RUNNER_TEMP/frontend-node"
          echo "$RUNNER_TEMP/frontend-node/bin" >> "$GITHUB_PATH"
          python3 scripts/install-web-test-browser.py "$RUNNER_TEMP/web-test-browser"
          sudo apt-get update
          mapfile -t web_browser_dependencies < "$RUNNER_TEMP/web-test-browser/deb.deps"
          sudo apt-get satisfy -y --no-install-recommends "${web_browser_dependencies[@]}"
          sudo apt-get install -y --no-install-recommends xvfb
          python3 -m pip install --requirement requirements/oracle-generation.txt
      - name: Record browser pin and check driver lifecycle
        run: |
          mkdir -p build/packaged-web-ci
          cp scripts/web-test-browser.json build/packaged-web-ci/browser-lock.json
          "$RUNNER_TEMP/web-test-browser/chrome" --version | tee build/packaged-web-ci/browser-version.txt
          python3 scripts/test-packaged-browser-install.py
          node --check scripts/check-packaged-web-browser.mjs
          node --test scripts/packaged-browser-upload.test.mjs
          node --check scripts/packaged-browser-restart.mjs
          node --test scripts/packaged-browser-restart.test.mjs
          node --check scripts/packaged-browser-cdp-diagnostics.mjs
          node --test scripts/packaged-browser-cdp-diagnostics.test.mjs
      - name: Build archives and verify browser expiry and distribution contents
        env:
          DECOMP_BROWSER_CHROME: ${{ runner.temp }}/web-test-browser/chrome
          DECOMP_BROWSER_JS_RUNTIME: ${{ runner.temp }}/frontend-node/bin/node
        run: |
          ./gradlew --no-daemon test --tests 'decompengine.web.BrowserSessionExpiryTest' \
            installDist distZip distTar verifyPackagedWeb verifyGhidraDistributionArchives \
            verifyAcpGateHelperDistribution verifyLlvmBehaviorHelperDistribution \
            verifyKotlinBootClasspathDistribution
          web_distribution=("$GITHUB_WORKSPACE"/build/distributions/*.zip)
          test "${#web_distribution[@]}" -eq 1
          test -f "${web_distribution[0]}"
          echo "WEB_TEST_ARCHIVE=${web_distribution[0]}" >> "$GITHUB_ENV"
      - name: Bind the current package to its exact clean source tree
        env:
          DECOMP_BROWSER_JS_RUNTIME: ${{ runner.temp }}/frontend-node/bin/node
          DECOMP_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          DECOMP_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          mkdir -p build/packaged-current-package
          cp "$WEB_TEST_ARCHIVE" build/packaged-current-package/current-package.zip
          archive_sha256="$(sha256sum build/packaged-current-package/current-package.zip | cut -d ' ' -f 1)"
          archive_bytes="$(stat -c '%s' build/packaged-current-package/current-package.zip)"
          gradle_output="$(./gradlew --version --console=plain)"
          gradle_version="$(sed -n 's/^Gradle //p' <<< "$gradle_output" | sed -n '1p')"
          java_version="$(java -version 2>&1 | sed -n '1p')"
          node_version="$(node --version | sed 's/^v//')"
          python3 - "$archive_sha256" "$archive_bytes" "$gradle_version" "$java_version" "$node_version" <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          archive_sha256, archive_bytes, gradle, java, node = sys.argv[1:]
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          assert commit == os.environ['GITHUB_SHA']
          assert subprocess.check_output(['git', 'status', '--porcelain=v1'], text=True) == ''
          event_name = os.environ['GITHUB_EVENT_NAME']
          head = os.environ.get('DECOMP_PR_HEAD_SHA', '')
          base = os.environ.get('DECOMP_PR_BASE_SHA', '')
          if event_name == 'pull_request':
              assert len(head) == 40 and all(ch in '0123456789abcdef' for ch in head)
              assert len(base) == 40 and all(ch in '0123456789abcdef' for ch in base)
              commit_object = subprocess.check_output(['git', 'cat-file', '-p', 'HEAD'], text=True)
              parents = {line.split(' ', 1)[1] for line in commit_object.splitlines() if line.startswith('parent ')}
              assert head in parents and base in parents, 'Built merge commit does not bind the recorded PR head and base'
              pull_request = {'headCommit': head, 'baseCommit': base}
          else:
              assert not head and not base
              pull_request = None
          record = {
              'schema': 'packaged-current-build/v2',
              'repository': 'minsago-elite/decomp_thing',
              'commit': commit,
              'tree': tree,
              'pullRequest': pull_request,
              'cleanSource': True,
              'build': {
                  'workflow': 'CI',
                  'runId': os.environ['GITHUB_RUN_ID'],
                  'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
                  'gradleVersion': gradle,
                  'javaVersion': java,
                  'nodeVersion': node,
              },
              'archive': {
                  'file': 'current-package.zip',
                  'sha256': archive_sha256,
                  'bytes': int(archive_bytes),
              },
          }
          assert gradle and java and node
          Path('build/packaged-current-package/current-source.json').write_text(
              json.dumps(record, indent=2, sort_keys=True) + '\n'
          )
          PY
      - name: Require positive real-browser expiry evidence
        run: >-
          python3 scripts/test-ci-partitions.py
          --check-browser-reports build/test-results/test
          --output build/packaged-web-ci/browser-expiry-tests.json
      - name: Retain focused browser expiry XML and gate receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-browser-expiry-test-reports
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: |
            build/test-results/test/TEST-decompengine.web.BrowserSessionExpiryTest.xml
            build/packaged-web-ci/browser-expiry-tests.json
      - name: Verify legacy deep links remain inert in pinned Chrome
        run: |
          node scripts/check-packaged-web-browser.mjs \
            --archive "$WEB_TEST_ARCHIVE" \
            --chrome "$RUNNER_TEMP/web-test-browser/chrome" --java-home "$JAVA_HOME" \
            --python "$(command -v python3)" --work-parent "$GITHUB_WORKSPACE/build" --mode legacy --no-sandbox
      - name: Exercise packaged session and recovery in pinned Chrome
        run: |
          node scripts/check-packaged-web-browser.mjs \
            --archive "$WEB_TEST_ARCHIVE" \
            --chrome "$RUNNER_TEMP/web-test-browser/chrome" --java-home "$JAVA_HOME" \
            --python "$(command -v python3)" --work-parent "$RUNNER_TEMP" --mode session --no-sandbox
      - name: Exercise exact packaged upload readiness and lost-response retry
        run: |
          node scripts/check-packaged-web-browser.mjs \
            --archive "$WEB_TEST_ARCHIVE" \
            --chrome "$RUNNER_TEMP/web-test-browser/chrome" --java-home "$JAVA_HOME" \
            --python "$(command -v python3)" --work-parent "$RUNNER_TEMP" --mode upload --no-sandbox
      - name: Exercise exact packaged binary metadata and malformed-response recovery
        run: |
          node scripts/check-packaged-web-browser.mjs \
            --archive "$WEB_TEST_ARCHIVE" \
            --chrome "$RUNNER_TEMP/web-test-browser/chrome" --java-home "$JAVA_HOME" \
            --python "$(command -v python3)" --work-parent "$GITHUB_WORKSPACE/build" --mode metadata --no-sandbox
      - name: Preserve focused dashboard rows during actual background updates
        run: |
          node scripts/check-packaged-web-browser.mjs \
            --archive "$WEB_TEST_ARCHIVE" \
            --chrome "$RUNNER_TEMP/web-test-browser/chrome" --java-home "$JAVA_HOME" \
            --python "$(command -v python3)" --work-parent "$GITHUB_WORKSPACE/build" --mode live --no-sandbox
      - name: Verify bounded dashboard paging with ten thousand persisted jobs
        run: |
          node scripts/check-packaged-web-browser.mjs \
            --archive "$WEB_TEST_ARCHIVE" \
            --chrome "$RUNNER_TEMP/web-test-browser/chrome" --java-home "$JAVA_HOME" \
            --python "$(command -v python3)" --work-parent "$GITHUB_WORKSPACE/build" --mode scale --no-sandbox
      - name: Exercise same-origin JVM restart and two-tab stale progress pin
        run: |
          xvfb-run -a node scripts/check-packaged-web-browser.mjs \
            --archive "$WEB_TEST_ARCHIVE" \
            --chrome "$RUNNER_TEMP/web-test-browser/chrome" --java-home "$JAVA_HOME" \
            --python "$(command -v python3)" --work-parent "$GITHUB_WORKSPACE/build" --mode restart --no-sandbox
      - name: Audit packaged routes for reflow, contrast, focus, assets under CSP and timing
        run: |
          node scripts/check-packaged-web-browser.mjs \
            --archive "$WEB_TEST_ARCHIVE" \
            --chrome "$RUNNER_TEMP/web-test-browser/chrome" --java-home "$JAVA_HOME" \
            --python "$(command -v python3)" --work-parent "$GITHUB_WORKSPACE/build" --mode audit --no-sandbox
      - name: Exercise explicit Vite proxy against the same packaged JVM
        run: |
          node scripts/check-packaged-web-browser.mjs \
            --archive "$WEB_TEST_ARCHIVE" \
            --chrome "$RUNNER_TEMP/web-test-browser/chrome" --java-home "$JAVA_HOME" \
            --python "$(command -v python3)" --work-parent "$RUNNER_TEMP" --mode proxy --no-sandbox
          git diff --exit-code -- frontend/ contracts/web/v1/
      - name: Retain exact current package for the two-build upgrade run
        uses: actions/upload-artifact@v7
        with:
          name: packaged-web-current-source
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: build/packaged-current-package
      - name: Retain sanitized packaged web evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: packaged-web-verification
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/packaged-web-ci
            build/packaged-browser-*/report.json
            build/packaged-browser-*/*.png
            build/reports/tests/test
            build/test-results/test
            build/reports/junit-signatures

  web-upgrade-browser:
    needs: [web-packaged-build, web-upgrade-previous]
    name: Packaged cache upgrade from pinned prior build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/oracle-generation.txt
      - name: Cache reviewed frontend Node downloads
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/build/frontend-node-downloads
          key: frontend-node-archives-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-frontend-node.sh', 'scripts/frontend-node-sha256.txt', '.node-version', 'frontend/package.json') }}
      - name: Install pinned browser and test-driver tools
        env:
          DECOMP_FRONTEND_NODE_DOWNLOAD_CACHE: '1'
        run: |
          bash scripts/install-frontend-node.sh "$RUNNER_TEMP/frontend-node"
          echo "$RUNNER_TEMP/frontend-node/bin" >> "$GITHUB_PATH"
          python3 scripts/install-web-test-browser.py "$RUNNER_TEMP/web-test-browser"
          sudo apt-get update
          mapfile -t web_browser_dependencies < "$RUNNER_TEMP/web-test-browser/deb.deps"
          sudo apt-get satisfy -y --no-install-recommends "${web_browser_dependencies[@]}"
          python3 -m pip install --requirement requirements/oracle-generation.txt
          mkdir -p build/packaged-upgrade-inputs
          "$RUNNER_TEMP/web-test-browser/chrome" --version > build/packaged-upgrade-inputs/browser-version.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packaged-web-current-source
          path: build/packaged-upgrade-inputs/current
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packaged-web-pinned-previous
          path: build/packaged-upgrade-inputs/previous
      - name: Run the cache-enabled two-build upgrade in pinned Chrome
        env:
          DECOMP_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          DECOMP_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          node scripts/check-packaged-web-browser.mjs \
            --archive "$GITHUB_WORKSPACE/build/packaged-upgrade-inputs/current/current-package.zip" \
            --current-provenance "$GITHUB_WORKSPACE/build/packaged-upgrade-inputs/current/current-source.json" \
            --previous-archive "$GITHUB_WORKSPACE/build/packaged-upgrade-inputs/previous/previous-package.zip" \
            --previous-provenance "$GITHUB_WORKSPACE/build/packaged-upgrade-inputs/previous/previous-source.json" \
            --chrome "$RUNNER_TEMP/web-test-browser/chrome" --java-home "$JAVA_HOME" \
            --python "$(command -v python3)" --work-parent "$GITHUB_WORKSPACE/build" --mode upgrade --no-sandbox
      - name: Retain pinned upgrade report, source provenance, and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-web-upgrade-verification
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: |
            build/packaged-upgrade-inputs/browser-version.txt
            build/packaged-upgrade-inputs/current/current-source.json
            build/packaged-upgrade-inputs/previous/previous-source.json
            build/packaged-browser-*/report.json
            build/packaged-browser-*/*.png

  web-packaged:
    name: Packaged web contracts and browser
    needs: [web-packaged-build, web-upgrade-browser]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require primary packaged journeys and pinned two-build upgrade
        env:
          PACKAGED_RESULT: ${{ needs.web-packaged-build.result }}
          UPGRADE_RESULT: ${{ needs.web-upgrade-browser.result }}
        run: |
          test "$PACKAGED_RESULT" = success
          test "$UPGRADE_RESULT" = success

  kotlin-suite:
    needs: frontend
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/build/npm-download-cache
    name: kotlin-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core
            test-shard: core-main
          - shard: oracle
            test-shard: core-oracle
          - shard: live
            test-shard: live-rest
          - shard: live-fulltree
            test-shard: live-fulltree
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: ./.github/actions/setup-gradle-compiler-cache
        id: gradle-cache
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: Cache locked frontend package downloads
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/build/npm-download-cache/_cacache
          key: frontend-npm-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/package-lock.json', 'frontend/package.json', 'frontend/.npmrc', '.node-version', 'scripts/install-frontend-node.sh', 'scripts/frontend-node-sha256.txt') }}
      - name: Cache reviewed frontend Node downloads
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/build/frontend-node-downloads
          key: frontend-node-archives-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-frontend-node.sh', 'scripts/frontend-node-sha256.txt', '.node-version', 'frontend/package.json') }}
      - name: Install pinned build-only frontend toolchain
        env:
          DECOMP_FRONTEND_NODE_DOWNLOAD_CACHE: '1'
        run: |
          bash scripts/install-frontend-node.sh "$RUNNER_TEMP/frontend-node"
          echo "$RUNNER_TEMP/frontend-node/bin" >> "$GITHUB_PATH"
      - name: Install sandbox host prerequisites
        timeout-minutes: 10
        run: |
          # Bound stalled mirrors without changing required packages or test budgets.
          apt_acquire_options=(
            -o Acquire::Retries=2
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          sudo apt-get "${apt_acquire_options[@]}" --error-on=any update
          sudo apt-get "${apt_acquire_options[@]}" install -y --no-install-recommends \
            bubblewrap \
            binutils \
            build-essential \
            dbus-user-session \
            e2fsprogs \
            bzip2 \
            ca-certificates \
            curl \
            python3 \
            systemd \
            util-linux
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind /usr /usr --ro-bind /lib /lib --ro-bind /lib64 /lib64 /usr/bin/true
      - name: Check runtime provisioning with isolated inert fixtures
        run: python3 scripts/test-ci-bundled-runtime.py
      - name: Check CI partition routing and report ownership controls
        if: matrix.shard == 'core'
        run: python3 scripts/test-ci-partitions.py
      - name: Check pinned Goose archive acquisition controls
        if: matrix.shard == 'core'
        run: python3 scripts/test-goose-archive-download.py
      - name: Check pinned Codex ACP archive acquisition controls
        if: matrix.shard == 'core'
        run: python3 scripts/test-codex-acp-archive-download.py
      - name: Check recovery scenario coverage controls
        if: matrix.shard == 'core'
        run: python3 scripts/test-web-job-recovery-inventory.py
      - name: Verify real Angr qualification selection and pin controls
        if: matrix.shard == 'core'
        run: python3 scripts/test-angr-qualification-selection.py
      - name: Select relevant real Angr qualification
        id: angr-changes
        if: matrix.shard == 'core'
        env:
          ANGR_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/select-angr-qualification.sh
      - name: Prepare root-owned oracle JVM and system libraries
        run: bash scripts/ci-prepare-oracle-runtime.sh
      - name: Prepare required live ACP sandbox host
        run: scripts/ci-prepare-acp-sandbox.sh
      - name: Prepare finite ACP quota fixture
        run: bash scripts/ci-prepare-acp-quota.sh
      - name: Prepare bounded ext4 oracle scratch authority
        run: bash scripts/ci-prepare-oracle-ext4-scratch.sh
      - name: Prepare separate bounded ext4 bundled-analysis scratch
        run: bash scripts/ci-prepare-oracle-ext4-scratch.sh --bundled-ghidra
      - name: Prepare separate bundled interruption-resume scratch
        run: bash scripts/ci-prepare-oracle-ext4-scratch.sh --bundled-ghidra-resume
      - name: Prepare separate bundled resume fresh-control scratch
        run: bash scripts/ci-prepare-oracle-ext4-scratch.sh --bundled-ghidra-resume-control
      - name: Prepare executable root-owned application-bundled Ghidra
        run: bash scripts/ci-prepare-bundled-ghidra-runtime.sh
      - name: Cache verified pinned Goose archive
        uses: actions/cache@v6
        if: matrix.shard == 'live'
        with:
          path: ${{ github.workspace }}/build/acp-compatibility/download-cache/goose-x86_64-unknown-linux-gnu.tar.bz2
          key: goose-acp-archive-v1-${{ runner.os }}-${{ runner.arch }}-a1cf4856a765d07d6b95689a53c7bca21fcc6e6d65c0dfd064fc704052b85a7b
      - name: Qualify pinned credential-free third-party ACP initialize
        id: goose-initialize
        if: matrix.shard == 'live'
        continue-on-error: true
        run: scripts/ci-qualify-goose-acp.sh
      - name: Cache verified pinned Codex ACP archive
        uses: actions/cache@v6
        if: matrix.shard == 'live' && steps.goose-initialize.outcome == 'success'
        with:
          path: ${{ github.workspace }}/build/acp-codex-compatibility/download-cache/codex-acp-0.16.0-x86_64-unknown-linux-gnu.tar.gz
          key: codex-acp-archive-v1-${{ runner.os }}-${{ runner.arch }}-0a9ad6c31ec9b2b87dccb7e9da3faf5d387e74470d24dbced75a160ed7b22d06
      - name: Qualify pinned credential-free codex-acp authentication boundary
        if: matrix.shard == 'live' && steps.goose-initialize.outcome == 'success'
        run: scripts/ci-qualify-codex-acp.sh
      - name: Cache real Angr package downloads
        uses: actions/cache@v6
        if: matrix.shard == 'core' && steps.angr-changes.outputs.required == 'true'
        with:
          path: ${{ github.workspace }}/build/pip-download-cache
          key: angr-pip-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('requirements/angr-qualification.txt', 'requirements/angr-compatibility.txt') }}
      - name: Install real Angr qualification prerequisite
        if: matrix.shard == 'core' && steps.angr-changes.outputs.required == 'true'
        run: sudo apt-get install -y --no-install-recommends python3-venv
      - name: Require real Angr argv and stdin discovery
        if: matrix.shard == 'core' && steps.angr-changes.outputs.required == 'true'
        timeout-minutes: 8
        run: bash scripts/ci-qualify-angr.sh
      - name: Retain real Angr fixture and tool evidence
        uses: actions/upload-artifact@v7
        if: always() && matrix.shard == 'core' && steps.angr-changes.outputs.required == 'true'
        with:
          name: real-angr-qualification
          retention-days: 14
          if-no-files-found: error
          path: |
            build/angr-qualification
            build/test-results/realAngrQualification
            build/reports/tests/realAngrQualification
      - name: Run JVM and Kotlin checks
        env:
          DECOMP_REQUIRE_ORACLE_EXT4_SCRATCH: "true"
          DECOMP_REQUIRE_BUNDLED_GHIDRA_EXECUTION: "true"
          DECOMP_CI_TEST_SHARD: ${{ matrix.test-shard }}
        run: scripts/ci.sh
      - name: Require every source-declared recovery scenario in core reports
        if: always() && matrix.shard == 'core'
        run: >-
          python3 scripts/verify-web-job-recovery.py
          --reports build/test-results/test
          --output build/web-job-recovery-inventory.json
      - name: Retain Kotlin partition reports
        run: |
          mv build/test-results/test build/test-results/full-suite
          mv build/reports/tests/test build/reports/tests/full-suite
      - name: Verify quota-backed repair snapshot layouts
        if: matrix.shard == 'core'
        env:
          DECOMP_CI_TEST_SHARD: ${{ matrix.test-shard }}
        run: bash scripts/test-repair-validation-snapshot.sh --ci-verify-installed-analysis-io
      - name: Require third-party ACP initialize qualification
        if: always() && matrix.shard == 'live'
        env:
          GOOSE_INITIALIZE_OUTCOME: ${{ steps.goose-initialize.outcome }}
        run: test "$GOOSE_INITIALIZE_OUTCOME" = success
      - name: Release root-owned application-bundled Ghidra
        if: always()
        run: bash scripts/ci-release-bundled-ghidra-runtime.sh
      - name: Release bounded ext4 oracle scratch authority
        if: always()
        run: bash scripts/ci-release-oracle-ext4-scratch.sh
      - name: Release bounded ext4 bundled-analysis fixture scratch
        if: always()
        run: bash scripts/ci-release-oracle-ext4-scratch.sh --bundled-ghidra
      - name: Release bundled interruption-resume scratch
        if: always()
        run: bash scripts/ci-release-oracle-ext4-scratch.sh --bundled-ghidra-resume
      - name: Release bundled resume fresh-control scratch
        if: always()
        run: bash scripts/ci-release-oracle-ext4-scratch.sh --bundled-ghidra-resume-control
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kotlin-${{ matrix.shard }}-test-reports
          if-no-files-found: error
          path: |
            build/reports/tests/full-suite
            build/test-results/full-suite
            build/reports/tests/test
            build/test-results/test
            build/reports/junit-signatures
            build/web-job-recovery-inventory.json
            build/reports/tests/v3BoundaryFinalStagingIsolated
            build/test-results/v3BoundaryFinalStagingIsolated
            build/reports/tests/v3BoundaryPublicationIsolated
            build/test-results/v3BoundaryPublicationIsolated
            build/reports/tests/v3BoundaryCensusIsolated
            build/test-results/v3BoundaryCensusIsolated
            build/reports/tests/gccCompilerEnginePlanningIsolated
            build/test-results/gccCompilerEnginePlanningIsolated
            build/analysis-native-installed-verification.txt
      - name: Retain bounded ACP integration failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acp-required-contract-diagnostics-${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 14
          path: build/acp-required-contract-diagnostics/
      - name: Release finite ACP quota fixture
        if: always()
        run: bash scripts/ci-release-acp-quota.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kotlin-${{ matrix.shard }}-bundled-ghidra-contained-fixture-evidence
          path: build/contained-ghidra-evidence
      - uses: actions/upload-artifact@v7
        if: always() && matrix.shard == 'live'
        with:
          name: kotlin-${{ matrix.shard }}-acp-goose-compatibility-evidence
          path: build/acp-compatibility/results
      - uses: actions/upload-artifact@v7
        if: always() && matrix.shard == 'live'
        with:
          name: kotlin-${{ matrix.shard }}-acp-codex-authentication-evidence
          path: build/acp-codex-compatibility/results
      # One successful core partition publishes per default-branch revision.
      # Other partitions and every PR restore only; dependency caches stay separate.
      - name: Bound compiler cache publication to one GiB
        id: compiler-cache-size
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.shard == 'core'
        run: |
          if test -d "$GITHUB_WORKSPACE/build/ci-compiler-cache"; then
            cache_bytes="$(du --summarize --bytes "$GITHUB_WORKSPACE/build/ci-compiler-cache" | cut -f1)"
            printf 'Compiler cache bytes: %s (publication limit: 1073741824)\n' "$cache_bytes"
            if test "$cache_bytes" -le 1073741824; then
              echo 'publish=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Publish refreshed compiler outputs after successful qualification
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.shard == 'core' && steps.compiler-cache-size.outputs.publish == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/build/ci-compiler-cache
          key: ${{ steps.gradle-cache.outputs.compiler-cache-key }}


  kotlin:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    needs: kotlin-suite
    if: ${{ !cancelled() }}
    steps:
      - name: Require all Kotlin test partitions
        env:
          SHARD_RESULT: ${{ needs.kotlin-suite.result }}
        run: test "$SHARD_RESULT" = success
      - uses: actions/checkout@v7
      - name: Download only standard Kotlin test reports in separate artifact directories
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kotlin-*-test-reports
          merge-multiple: false
          path: build/ci-partition-reports
          digest-mismatch: error
      - name: Require report ownership and reject cross-partition duplicate tests
        run: |
          python3 scripts/test-ci-partitions.py --check-reports build/ci-partition-reports \
            --output build/ci-partition-inventory.json
      - name: Retain partition inventory result
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kotlin-partition-inventory
          if-no-files-found: warn
          path: build/ci-partition-inventory.json

  bundled-ghidra:
    needs: frontend
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/build/npm-download-cache
      GRADLE_USER_HOME: ${{ github.workspace }}/build/gradle-user-home
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: ./.github/actions/setup-gradle-compiler-cache
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: Cache locked frontend package downloads
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/build/npm-download-cache/_cacache
          key: frontend-npm-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/package-lock.json', 'frontend/package.json', 'frontend/.npmrc', '.node-version', 'scripts/install-frontend-node.sh', 'scripts/frontend-node-sha256.txt') }}
      - name: Cache reviewed frontend Node downloads
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/build/frontend-node-downloads
          key: frontend-node-archives-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-frontend-node.sh', 'scripts/frontend-node-sha256.txt', '.node-version', 'frontend/package.json') }}
      - name: Install pinned build-only frontend toolchain
        env:
          DECOMP_FRONTEND_NODE_DOWNLOAD_CACHE: '1'
        run: |
          bash scripts/install-frontend-node.sh "$RUNNER_TEMP/frontend-node"
          echo "$RUNNER_TEMP/frontend-node/bin" >> "$GITHUB_PATH"
      - name: Verify installed direct-API Ghidra without an external installation
        env:
          RUN_REAL_GHIDRA: "true"
          RUN_REAL_GHIDRA_CALL_SITES: "true"
          RUN_REAL_GHIDRA_NATIVE_CALLS: "true"
          RUN_REAL_GHIDRA_PURE_RENDERING: "true"
        run: |
          unset GHIDRA_HOME
          mkdir -p build/exporter-rendering-v16
          ./gradlew --no-daemon test \
            --tests decompengine.analysis.BundledGhidraTest \
            --tests decompengine.analysis.BundledGhidraManifestRejectionTest \
            --tests decompengine.project.GhidraProgramModelExporterTest \
            --tests decompengine.project.ReferencedDataBytesRealGhidraTest \
            --tests decompengine.project.GhidraReferencedBytesExporterTest \
            --tests decompengine.project.RecoveredCallSitesTest \
            --tests decompengine.project.NativeCallCollectorRealTest \
            --tests decompengine.project.NativeCallObservationsV1Test \
            --tests decompengine.oracle.gcc.GccBundledNativeCallCaptureTest \
            --tests decompengine.mvp.GhidraDecompilerTest \
            --tests decompengine.project.ReconstructionPipelineTest \
            --tests decompengine.web.SourceTreeJobReconstructorTest
      - name: Verify ZIP and TAR bundle contents and native executable modes
        run: ./gradlew --no-daemon --offline verifyGhidraDistributionArchives
      - name: Verify atomic bundle publication and refusal controls
        run: ./gradlew --no-daemon --offline verifyAtomicGhidraBundlePublication
      - name: Verify installed Ghidra publication overlap coordinator controls
        run: python3 scripts/qualify-ghidra-install-overlap.py --self-test
      - name: Qualify real installed reconstruction during same-bundle publication
        timeout-minutes: 30
        env:
          QUALIFICATION_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          QUALIFICATION_PR_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 -B scripts/qualify-ghidra-install-overlap.py --offline --deadline-seconds 1500 --cleanup-reserve-seconds 240
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bundled-ghidra-install-overlap
          include-hidden-files: true
          retention-days: 14
          path: build/ghidra-install-overlap
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bundled-ghidra-test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
            build/reports/junit-signatures
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bundled-ghidra-rendering-parity
          path: |
            build/exporter-rendering-v16/native/equality-*/baseline-unoptimized/reports
            build/exporter-rendering-v16/native/equality-*/candidate-pure/reports

  archival-ghidra:
