      XDG_CONFIG_HOME: ${{ github.workspace }}/build/issue97-bwrap/config
      XDG_DATA_HOME: ${{ github.workspace }}/build/issue97-bwrap/data
      JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=${{ github.workspace }}/build/issue97-bwrap/tmp -Djna.tmpdir=${{ github.workspace }}/build/issue97-bwrap/tmp -Duser.home=${{ github.workspace }}/build/issue97-bwrap/home
      TMPDIR: ${{ github.workspace }}/build/issue97-bwrap/tmp
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Create repository-owned observation paths
        run: install -d -m 0700 build/issue97-bwrap/tmp build/issue97-bwrap/home build/issue97-bwrap/evidence
      - name: Install bubblewrap and allow unprivileged user namespaces
