          echo "$GITHUB_WORKSPACE/build/issue97-bwrap/frontend-node/bin" >> "$GITHUB_PATH"
      - name: Fetch authenticated locked Clang artifacts
        run: |
          bash scripts/ci-fetch-llvm-release-artifacts.sh \
