      - name: Run the supplemental bubblewrap behavior corpus through the generic backend
        env:
          HOME: ${{ github.workspace }}/build/issue97-bwrap/home
        run: |
          python3 -B -m oracle.llvm.behavior_corpus_bwrap --run \
            --artifact-root "$GITHUB_WORKSPACE/build/issue97-bwrap/artifacts" \
            --temporary-root "$GITHUB_WORKSPACE/build/issue97-bwrap/tmp" \
            --json-output "$GITHUB_WORKSPACE/build/issue97-bwrap/evidence/behavior-corpus-bwrap-v1-report.json"
      - name: Replay the retained corpus report offline
        run: |
          python3 -B -m oracle.llvm.behavior_corpus_bwrap --verify-pair \
            oracle/llvm/22.1.6/behavior-corpus-bwrap-v1.json \
            "$GITHUB_WORKSPACE/build/issue97-bwrap/evidence/behavior-corpus-bwrap-v1-report.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: llvm-produced-program-bwrap-observation
          path: build/issue97-bwrap/evidence
          if-no-files-found: warn

  runtime-capture-host-preflight:
    # Temporary NEW-GENERATION candidate, not a supported baseline; runner expiry2027-04-17.
    if: github.event_name == 'workflow_dispatch' && inputs.qualification == 'runtime-capture-host-preflight'
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    permissions:
      contents: read
    env:
      HOME: ${{ github.workspace }}/build/issue97-host-inspect/home
      TMPDIR: ${{ github.workspace }}/build/issue97-host-inspect/tmp
      XDG_CACHE_HOME: ${{ github.workspace }}/build/issue97-host-inspect/cache
      XDG_CONFIG_HOME: ${{ github.workspace }}/build/issue97-host-inspect/config
      XDG_DATA_HOME: ${{ github.workspace }}/build/issue97-host-inspect/share
      XDG_RUNTIME_DIR: ${{ github.workspace }}/build/issue97-host-inspect/run
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Allocate owned state and fetch exact public inspection source
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          /usr/bin/timeout --kill-after=2s 43s /bin/bash --noprofile --norc -euo pipefail <<'SOURCE_BOOTSTRAP'
          umask 077
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          root="$GITHUB_WORKSPACE/build/issue97-host-inspect"
          test ! -e "$root"
          mkdir -p "$root/"{home,tmp,cache,config,share,run,artifacts}
          mkdir -p "$GITHUB_WORKSPACE/oracle/llvm" "$GITHUB_WORKSPACE/.github/workflows"
          for required_tool in /usr/bin/prlimit /usr/bin/stat; do
            if [[ ! -x "$required_tool" ]]; then
              printf 'SOURCE_BOOTSTRAP_REFUSED: REQUIRED_TOOL_UNAVAILABLE %s\n' "$required_tool" >&2
              exit 78
            fi
          done
          bounded_source_file() {
            [[ -f "$1" && ! -L "$1" ]] || { printf 'SOURCE_BOOTSTRAP_REFUSED: SOURCE_FILE_KIND\n' >&2; exit 78; }
            local source_bytes
            source_bytes="$(/usr/bin/stat --printf='%s' -- "$1")"
            [[ "$source_bytes" =~ ^[0-9]{1,6}$ && "$source_bytes" -gt 0 && "$source_bytes" -le 524288 ]] || \
              { printf 'SOURCE_BOOTSTRAP_REFUSED: SOURCE_FILE_SIZE\n' >&2; exit 78; }
          }
          # Anonymous exact-commit PUBLIC source only; no auth, config, retries or branch fallback.
          /usr/bin/prlimit --fsize=524288:524288 -- \
            /usr/bin/env -i PATH=/usr/bin:/bin HOME="$root/home" TMPDIR="$root/tmp" LANG=C LC_ALL=C \
            /usr/bin/curl --disable --fail --silent --show-error --location --max-redirs 3 \
              --proto '=https' --proto-redir '=https' --connect-timeout 5 --max-time 18 --max-filesize 524288 \
              "https://raw.githubusercontent.com/minsago-elite/decomp_thing/$GITHUB_SHA/oracle/llvm/capture_reference_runtime.py" \
              --output "$GITHUB_WORKSPACE/oracle/llvm/capture_reference_runtime.py"
          bounded_source_file "$GITHUB_WORKSPACE/oracle/llvm/capture_reference_runtime.py"
          printf '%s  %s\n' \
            36165fa3344000ea5965e56cb0c24075e9b1594b12ff3a885eb1f23d8b93cef7 \
            "$GITHUB_WORKSPACE/oracle/llvm/capture_reference_runtime.py" | /usr/bin/sha256sum --check --strict
          /usr/bin/prlimit --fsize=524288:524288 -- \
            /usr/bin/env -i PATH=/usr/bin:/bin HOME="$root/home" TMPDIR="$root/tmp" LANG=C LC_ALL=C \
            /usr/bin/curl --disable --fail --silent --show-error --location --max-redirs 3 \
              --proto '=https' --proto-redir '=https' --connect-timeout 5 --max-time 18 --max-filesize 524288 \
              "https://raw.githubusercontent.com/minsago-elite/decomp_thing/$GITHUB_SHA/.github/workflows/llvm-oracle-model.yml" \
              --output "$GITHUB_WORKSPACE/.github/workflows/llvm-oracle-model.yml"
          bounded_source_file "$GITHUB_WORKSPACE/.github/workflows/llvm-oracle-model.yml"
          # Actual source/bootstrap tool hashes are UNQUALIFIED observations, not host approval.
          printf 'status=public-source-bootstrap-unqualified\ncommit=%s\n' "$GITHUB_SHA" \
            > "$root/artifacts/source-bootstrap.txt"
          /usr/bin/sha256sum "$GITHUB_WORKSPACE/oracle/llvm/capture_reference_runtime.py" \
            "$GITHUB_WORKSPACE/.github/workflows/llvm-oracle-model.yml" \
            /usr/bin/curl /usr/bin/env /bin/bash /usr/bin/timeout /usr/bin/sha256sum /usr/bin/prlimit /usr/bin/stat \
            >> "$root/artifacts/source-bootstrap.txt"
          SOURCE_BOOTSTRAP
      - name: Observe read-only host facts (UNQUALIFIED, never a capture or target run)
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          root="$GITHUB_WORKSPACE/build/issue97-host-inspect"
          timeout --kill-after=2s 88s python3 -I -B -X "pycache_prefix=$root/cache/python" \
            oracle/llvm/capture_reference_runtime.py --root "$root" --inspect-host
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: llvm-reference-host-UNQUALIFIED-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: build/issue97-host-inspect/artifacts/
