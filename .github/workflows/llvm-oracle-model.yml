            --temporary-root "$GITHUB_WORKSPACE/build/issue97-bwrap/tmp" \
            --json-output "$GITHUB_WORKSPACE/build/issue97-bwrap/evidence/produced-program-observation.json"
      - name: Verify the retained observation offline
