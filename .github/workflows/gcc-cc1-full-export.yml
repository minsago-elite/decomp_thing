name: GCC live full export

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_call:
    inputs:
      capture-mode:
        description: Closed manual diagnostic capture mode
        required: true
        type: string

concurrency:
  # Unrelated label events must not cancel a qualification before its job guard runs.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.capture-mode || 'qualification' }}${{ github.event.action == 'labeled' && !contains(fromJSON('["qualify:cc1-full-export","qualify:driver-full-export","qualify:driver-native-calls"]'), github.event.label.name) && '-ignored-label' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select-captures:
    if: (github.event_name == 'workflow_dispatch' && contains(fromJSON('["cc1-runtime-diagnostics","cc1-full-export","cc1-native-calls","cc1-engine-cli","driver-native-calls","driver-interface-observations"]'), inputs.capture-mode)) || (github.event_name == 'pull_request' && inputs.capture-mode == '' && (github.event.action != 'labeled' || contains(fromJSON('["qualify:cc1-full-export","qualify:driver-full-export","qualify:driver-native-calls"]'), github.event.label.name)) && (contains(github.event.pull_request.labels.*.name, 'qualify:cc1-full-export') || contains(github.event.pull_request.labels.*.name, 'qualify:driver-full-export') || contains(github.event.pull_request.labels.*.name, 'qualify:driver-native-calls')))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select independent capture lanes
        id: select
        env:
          CAPTURE_MODE: ${{ inputs.capture-mode }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        shell: python
        run: |
          import json
          import os

          mode = os.environ["CAPTURE_MODE"]
          labels = json.loads(os.environ.get("PR_LABELS") or "[]") or []
          if not isinstance(labels, list) or not all(isinstance(label, str) for label in labels):
              raise ValueError("capture labels must be a list of strings")
          manual_modes = {"cc1-runtime-diagnostics", "cc1-full-export", "cc1-native-calls", "cc1-engine-cli", "driver-native-calls", "driver-interface-observations"}
          selected = []
          if mode:
              if mode not in manual_modes:
                  raise ValueError("unsupported capture mode")
              selected.append(("driver" if mode in {"driver-native-calls", "driver-interface-observations"} else "cc1",
                               "qualification" if mode == "cc1-full-export" else mode))
          else:
              for label, target, capture in (
                  ("qualify:cc1-full-export", "cc1", "qualification"),
                  ("qualify:driver-full-export", "driver", "qualification"),
                  ("qualify:driver-native-calls", "driver", "driver-native-calls"),
              ):
                  if label in labels:
                      selected.append((target, capture))
          if not selected:
              raise ValueError("no supported capture was selected")
          rows = [{"target": target, "capture_mode": capture,
                   "profile": "compiler-engines-exporter17-parallel.json" if target == "cc1" and capture == "qualification"
                              else "compiler-engines-exporter17.json"}
                  for target, capture in selected]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("matrix=" + json.dumps({"include": rows}, separators=(",", ":")) + "\n")

  cc1-live-full-export:
    needs: select-captures
    if: needs.select-captures.result == 'success'
    name: ${{ matrix.target }} ${{ matrix.capture_mode == 'cc1-runtime-diagnostics' && 'runtime diagnostics' || contains(fromJSON('["cc1-native-calls","driver-native-calls"]'), matrix.capture_mode) && 'native calls' || matrix.capture_mode == 'driver-interface-observations' && 'raw interface observations' || matrix.capture_mode == 'cc1-engine-cli' && 'engine CLI fresh/resume' || 'live full export' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-captures.outputs.matrix) }}
    env:
      DECOMP_GCC_CLI_FULL_EXPORT_ENGINE: ${{ matrix.target }}
      DECOMP_GCC_CLI_CAPTURE_MODE: ${{ matrix.capture_mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.target == 'driver' && 90 || 360 }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Select capture evidence directory
        run: echo "DECOMP_GCC_CLI_EVIDENCE_ROOT=$GITHUB_WORKSPACE/build/gcc-${DECOMP_GCC_CLI_FULL_EXPORT_ENGINE}-${DECOMP_GCC_CLI_CAPTURE_MODE}-evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/oracle-generation.txt
      - name: Install the pinned build-only frontend toolchain
        run: |
          bash scripts/install-frontend-node.sh "$RUNNER_TEMP/frontend-node"
          echo "$RUNNER_TEMP/frontend-node/bin" >> "$GITHUB_PATH"
      - name: Install checked profile validation dependencies
        run: python3 -m pip install --requirement requirements/oracle-generation.txt
      - name: Restore the manifest-keyed cc1 artifact pair
        id: cc1-artifact-cache
        if: matrix.target == 'cc1'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/gcc-cc1-engine/artifacts
          key: gcc-cc1-artifacts-v2-${{ hashFiles('oracle/gcc/16.2.0/source-lock.json', 'oracle/gcc/16.2.0/build-record.json', 'oracle/gcc/16.2.0/toolchain-reproduction.json', 'oracle/gcc/16.2.0/build-toolchain.Dockerfile', 'oracle/gcc/16.2.0/cc1-build-record.json', 'oracle/gcc/16.2.0/cc1-oracle-manifest.json') }}-lookup
          # Never saved under "-lookup": the prefix picks the newest entry, so a
          # repair entry supersedes a base entry that failed verification.
          restore-keys: |
            gcc-cc1-artifacts-v2-${{ hashFiles('oracle/gcc/16.2.0/source-lock.json', 'oracle/gcc/16.2.0/build-record.json', 'oracle/gcc/16.2.0/toolchain-reproduction.json', 'oracle/gcc/16.2.0/build-toolchain.Dockerfile', 'oracle/gcc/16.2.0/cc1-build-record.json', 'oracle/gcc/16.2.0/cc1-oracle-manifest.json') }}
      - name: Validate cached cc1 binaries before using them
        id: cached-cc1-verify
        if: matrix.target == 'cc1' && steps.cc1-artifact-cache.outputs.cache-matched-key != ''
        run: |
          workspace="$RUNNER_TEMP/gcc-cc1-engine"
          set +e
          python3 scripts/rebuild-gcc-compiler-engines.py \
            --workspace "$workspace" \
            --profile oracle/gcc/16.2.0/compiler-engines.json \
            --engine cc1 \
            --verify-artifacts
          status=$?
          set -e
          if test "$status" = 0; then
            echo 'valid=true' >> "$GITHUB_OUTPUT"
          else
            rm -rf -- "$workspace"
            echo 'Cached cc1 artifacts failed the pinned manifest check; rebuilding the pair.'
            echo 'valid=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild only cc1 from the authenticated GCC source
        if: matrix.target == 'cc1' && (steps.cc1-artifact-cache.outputs.cache-matched-key == '' || steps.cached-cc1-verify.outputs.valid != 'true')
        run: |
          python3 scripts/fetch-gcc-oracle-source.py "$RUNNER_TEMP/gcc-oracle-source"
          echo '8b0af79ba3426f49ba599eb0c7eea433c62ac5bb6ab5e7797f7d09d978f43543  oracle/gcc/16.2.0/build-toolchain.Dockerfile' \
            | sha256sum --check --strict
          docker buildx build \
            --no-cache \
            --platform linux/amd64 \
            --build-arg SOURCE_DATE_EPOCH=1786060800 \
            --load \
            --tag decomp-gcc-oracle-toolchain:16.2.0 \
            --file oracle/gcc/16.2.0/build-toolchain.Dockerfile \
            oracle/gcc/16.2.0
          observed="$(docker image inspect --format '{{.Id}}' decomp-gcc-oracle-toolchain:16.2.0)"
          echo 'recorded origin image: sha256:510c510f300d811df22c7769633575a94939073b529a73125bf96cfb96dc7248'
          echo "reproduced image: $observed"
          install -d -m 0700 "$RUNNER_TEMP/gcc-cc1-toolchain"
          (umask 077; docker image inspect "$observed" > "$RUNNER_TEMP/gcc-cc1-toolchain/inspect.json")
          python3 scripts/verify-gcc-toolchain-reproduction.py \
            --lock oracle/gcc/16.2.0/toolchain-reproduction.json \
            --build-record oracle/gcc/16.2.0/build-record.json \
            --inspect-json "$RUNNER_TEMP/gcc-cc1-toolchain/inspect.json"
          python3 scripts/rebuild-gcc-compiler-engines.py \
            --workspace "$RUNNER_TEMP/gcc-cc1-engine" \
            --source-cache "$RUNNER_TEMP/gcc-oracle-source" \
            --profile oracle/gcc/16.2.0/compiler-engines.json \
            --engine cc1
      - name: Verify the cc1 pair against its checked manifest
        if: matrix.target == 'cc1'
        run: |
          python3 scripts/rebuild-gcc-compiler-engines.py \
            --workspace "$RUNNER_TEMP/gcc-cc1-engine" \
            --profile oracle/gcc/16.2.0/compiler-engines.json \
            --engine cc1 \
            --verify-artifacts
      - name: Cache the verified cc1 pair for later qualifications
        # One entry per manifest; a new key only when the cached copy was invalid.
        if: matrix.target == 'cc1' && steps.cached-cc1-verify.outputs.valid != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/gcc-cc1-engine/artifacts
          key: gcc-cc1-artifacts-v2-${{ hashFiles('oracle/gcc/16.2.0/source-lock.json', 'oracle/gcc/16.2.0/build-record.json', 'oracle/gcc/16.2.0/toolchain-reproduction.json', 'oracle/gcc/16.2.0/build-toolchain.Dockerfile', 'oracle/gcc/16.2.0/cc1-build-record.json', 'oracle/gcc/16.2.0/cc1-oracle-manifest.json') }}${{ steps.cached-cc1-verify.outputs.valid == 'false' && format('-repair-{0}-{1}', github.run_id, github.run_attempt) || '' }}
      - name: Reclaim build-only GCC toolchain storage
        if: matrix.target == 'cc1' && (steps.cc1-artifact-cache.outputs.cache-matched-key == '' || steps.cached-cc1-verify.outputs.valid != 'true')
        run: |
          docker image rm decomp-gcc-oracle-toolchain:16.2.0
          docker buildx prune --all --force
      - name: Verify the checked driver pair against its manifest
        if: matrix.target == 'driver'
        run: python3 scripts/verify-gcc-oracle-artifacts.py oracle/gcc/16.2.0/oracle-manifest.json
      - name: Install contained-execution host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bubblewrap \
            binutils \
            build-essential \
            dbus-user-session \
            e2fsprogs \
            bzip2 \
            ca-certificates \
            curl \
            python3 \
            systemd \
            util-linux
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind /usr /usr --ro-bind /lib /lib --ro-bind /lib64 /lib64 /usr/bin/true
      - name: Provision the root-owned application JVM and libraries
        run: bash scripts/ci-prepare-oracle-runtime.sh
      - name: Prepare the live contained-execution host
        run: scripts/ci-prepare-acp-sandbox.sh
      - name: Prepare dedicated full-export scratch
        run: bash scripts/ci-prepare-oracle-ext4-scratch.sh --gcc-engine-cc1-fresh
      - name: Prepare the disjoint resume scratch for the engine CLI fresh/resume comparison
        if: matrix.capture_mode == 'cc1-engine-cli'
        run: bash scripts/ci-prepare-oracle-ext4-scratch.sh --gcc-engine-cc1-resume
      - name: Install the application-bundled Ghidra runtime
        run: bash scripts/ci-prepare-bundled-ghidra-runtime.sh --application
      - name: Verify the pinned Ghidra provenance archive and create evidence root
        run: |
          archive="$HOME/.gradle/caches/decomp-ghidra/ghidra_12.1.3_PUBLIC_20260817.zip"
          echo '93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54  '"$archive" \
            | sha256sum --check --strict
          install -d -m 0700 "$DECOMP_GCC_CLI_EVIDENCE_ROOT"
          echo "DECOMP_GCC_CLI_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Record capacity before the live export
        run: |
          df -h "$DECOMP_GCC_CLI_CC1_FRESH_SCRATCH" "$RUNNER_TEMP"
          df -i "$DECOMP_GCC_CLI_CC1_FRESH_SCRATCH" "$RUNNER_TEMP"
      - name: Sample per-command CPU during the diagnostic (diagnostic-only, outside the evidence root)
        if: inputs.capture-mode != '' || matrix.capture_mode == 'driver-native-calls'
        run: |
          : >"$RUNNER_TEMP/process-cpu-samples.txt"
          nohup setsid bash scripts/ci-sample-process-cpu.sh "$RUNNER_TEMP/process-cpu-samples.txt" 30 >/dev/null 2>&1 &
      - name: Run the selected contained capture
        env:
          # Full cc1 qualifications retain the explicit parallel runtime-6 profile. Driver captures and
          # native-call/interface/diagnostic lanes retain the checked serial exporter-17 profile.
          DECOMP_GCC_CLI_PROFILE: ${{ github.workspace }}/oracle/gcc/16.2.0/${{ matrix.profile }}
          DECOMP_GCC_CLI_EXPORT_BINARY: ${{ matrix.target == 'driver' && format('{0}/oracle/gcc/16.2.0/artifacts/gcc-driver.stripped', github.workspace) || format('{0}/gcc-cc1-engine/artifacts/gcc-cc1.stripped', runner.temp) }}
          DECOMP_GCC_CLI_CC1_BINARY: ${{ format('{0}/gcc-cc1-engine/artifacts/gcc-cc1.stripped', runner.temp) }}
        run: |
          if [[ "$DECOMP_GCC_CLI_CAPTURE_MODE" == cc1-engine-cli ]]; then
            # #927: installed gcc-engine-plan fresh run, then a forced interruption and same-journal resume on a
            # disjoint scratch mount; the test requires byte-identical model and planner outputs.
            DECOMP_GCC_CLI_ENGINE=cc1 exec scripts/ci-qualify-gcc-engine-cli.sh
          fi
          exec scripts/ci-qualify-gcc-cc1-full-export.sh "$DECOMP_GCC_CLI_CAPTURE_MODE"
      - name: Record capacity after the live export
        if: always()
        run: |
          if [[ -n "${DECOMP_GCC_CLI_CC1_FRESH_SCRATCH:-}" && -d "$DECOMP_GCC_CLI_CC1_FRESH_SCRATCH" ]]; then
            df -h "$DECOMP_GCC_CLI_CC1_FRESH_SCRATCH" "$RUNNER_TEMP"
            df -i "$DECOMP_GCC_CLI_CC1_FRESH_SCRATCH" "$RUNNER_TEMP"
          else
            echo 'cc1 scratch was not provisioned'
          fi
      - name: Retain capture logs and available evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gcc-${{ matrix.target }}-${{ matrix.capture_mode == 'cc1-runtime-diagnostics' && 'runtime-diagnostics' || contains(fromJSON('["cc1-native-calls","driver-native-calls"]'), matrix.capture_mode) && 'native-calls' || matrix.capture_mode == 'cc1-engine-cli' && 'engine-cli' || 'live-full-export' }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ env.DECOMP_GCC_CLI_EVIDENCE_ROOT }}
            ${{ runner.temp }}/process-cpu-samples.txt
            build/reports/tests/test
            build/test-results/test
            build/reports/junit-signatures
      - name: Release dedicated full-export scratch
        if: always()
        run: bash scripts/ci-release-oracle-ext4-scratch.sh --gcc-engine-cc1-fresh
      - name: Release the engine CLI resume scratch
        if: always() && matrix.capture_mode == 'cc1-engine-cli'
        run: bash scripts/ci-release-oracle-ext4-scratch.sh --gcc-engine-cc1-resume
      - name: Release the root-owned application Ghidra runtime
        if: always()
        run: bash scripts/ci-release-bundled-ghidra-runtime.sh --application
