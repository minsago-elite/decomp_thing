# The Gradle daemon compiles Kotlin in-process (below), so it carries the compiler's heap: a clean
# compileKotlin + compileTestKotlin peaked at 1.73 GiB live heap after GC and 184 MiB metaspace
# (#2008). -XX:-UsePerfData stops HotSpot writing /tmp/hsperfdata_<user>/<pid>; ./gradlew supplies
# the repository-local java.io.tmpdir and TMPDIR through gradle/repository-temp.sh.
org.gradle.jvmargs=-Xms256m -Xmx3g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:-UsePerfData
# A separate Kotlin daemon is shared by every checkout on the host whose heap request it satisfies,
# and keeps the temporary and log directories of the build that started it. Compiling in the Gradle
# daemon keeps compiler temporary files in this repository's java.io.tmpdir (#2008).
kotlin.compiler.execution.strategy=in-process
# Every toolchain is Java 21, the JVM that runs Gradle in CI. Auto-detection would start every
# other local JDK once per build to read its version, and each of those JVMs writes
# /tmp/hsperfdata_<user>/<pid> (#2008). Run Gradle on Java 21, or list other installations in
# org.gradle.java.installations.paths in ~/.gradle/gradle.properties.
org.gradle.java.installations.auto-detect=false
# Reuse JVM compiler outputs; every other task is excluded in build.gradle.kts.
org.gradle.caching=true
