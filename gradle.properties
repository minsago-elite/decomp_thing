# Gradle's own daemon defaults plus -XX:-UsePerfData, so HotSpot writes no /tmp/hsperfdata_<user>/<pid>.
# ./gradlew supplies the repository-local java.io.tmpdir and TMPDIR (#2008).
org.gradle.jvmargs=-Xms256m -Xmx512m -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError -XX:-UsePerfData
# The complete Kotlin source set exceeds the compiler daemon's 512 MiB default on clean builds.
# build.gradle.kts adds the Kotlin daemon's repository-local java.io.tmpdir to these arguments.
kotlin.daemon.jvmargs=-Xmx2048m -XX:-UsePerfData
# Reuse JVM compiler outputs; every other task is excluded in build.gradle.kts.
org.gradle.caching=true
