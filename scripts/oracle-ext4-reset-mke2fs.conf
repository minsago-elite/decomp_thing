# Versioned closed profile; no includes, undo, alternate I/O or external journal.
[defaults]
    force_undo = 0
    blocksize = 4096
    inode_size = 256
    inode_ratio = 16384
    enable_periodic_fsck = 0
[fs_types]
    ext4 = {
        features = has_journal,extent,filetype,sparse_super,large_file,dir_index,uninit_bg
    }
