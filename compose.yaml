services:
  llm-bin-patch:
    build:
      context: .
      args:
        APP_UID: ${LOCAL_UID:-1000}
        APP_GID: ${LOCAL_GID:-1000}
    init: true
    stdin_open: true
    tty: true
    depends_on:
      - binary-runner
    environment:
      BINARY_RUNNER_DIR: /runner
      BASE_URL: ${BASE_URL:-}
      API_KEY: ${API_KEY:-}
      MODEL: ${MODEL:-}
      REASONING_EFFORT: ${REASONING_EFFORT:-}
    volumes:
      - ${INPUT_DIR:-./input}:/input:ro
      - ${OUTPUT_DIR:-./output}:/output
      - runner-control:/runner
  binary-runner:
    build:
      context: .
      args:
        APP_UID: ${LOCAL_UID:-1000}
        APP_GID: ${LOCAL_GID:-1000}
    entrypoint: ["llm_bin_patch", "runner", "--control-dir", "/runner"]
    init: true
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      RUNNER_NETWORK_ISOLATED: "true"
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    volumes:
      - ${INPUT_DIR:-./input}:/input:ro
      - ${OUTPUT_DIR:-./output}:/output:ro
      - runner-control:/runner
  fixture-builder:
    profiles:
      - acceptance
    build:
      context: .
      args:
        APP_UID: ${LOCAL_UID:-1000}
        APP_GID: ${LOCAL_GID:-1000}
    entrypoint:
      - clang
    command:
      - -O0
      - -Wall
      - -Wextra
      - -std=c11
      - -fno-stack-protector
      - -U_FORTIFY_SOURCE
      - -D_FORTIFY_SOURCE=0
      - /fixture/01_out_of_bounds_write.c
      - -o
      - /input/binary_01
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${CVUL_SOURCE_DIR:-./benchmarks/fixtures/c-vul/src}:/fixture:ro
      - ${INPUT_DIR:-./input}:/input

volumes:
  runner-control:
