services:
  llm-bin-patch:
    profiles:
      - acp-host
    build:
      context: .
      args:
        APP_UID: ${ACP_SERVICE_UID:-1000}
        APP_GID: ${ACP_SERVICE_GID:-1000}
    user: "${ACP_SERVICE_UID:-1000}:${ACP_SERVICE_GID:-1000}"
    userns_mode: host
    init: true
    stdin_open: true
    tty: true
    network_mode: none
    pid: host
    cgroup: host
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - binary-runner-acp
    environment:
      ACP_CONFIG_FILE: /run/decomp-engine/acp/config.json
      BINARY_RUNNER_DIR: /runner
    tmpfs:
      - /tmp:size=512m,nosuid,nodev,mode=1777
    volumes:
      - ${INPUT_DIR:-./input}:/input:ro
      - ${OUTPUT_DIR:-./output}:/output
      - runner-control-acp:/runner
      - ${ACP_CONFIG_FILE:-./config/acp-v1.example.json}:/run/decomp-engine/acp/config.json:ro
      - ${ACP_AGENT_RUNTIME_ROOT:-./config/acp-host-prerequisites/agent-runtime}:/opt/decomp-acp-agent:ro
      - ${ACP_SANDBOX_GATE_HELPER_FILE:-./config/acp-host-prerequisites/decomp-acp-gate-helper}:/opt/decomp-acp-host/decomp-acp-gate-helper:ro
      - ${ACP_SYSTEMD_USER_RUNTIME:-./config/acp-host-prerequisites/user-runtime}:/run/user/${ACP_SERVICE_UID:-1000}:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro

  binary-runner-acp:
    profiles:
      - acp-host
    build:
      context: .
      args:
        APP_UID: ${ACP_SERVICE_UID:-1000}
        APP_GID: ${ACP_SERVICE_GID:-1000}
    user: "${ACP_SERVICE_UID:-1000}:${ACP_SERVICE_GID:-1000}"
    userns_mode: host
    entrypoint: ["llm_bin_patch", "runner", "--control-dir", "/runner"]
    init: true
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      RUNNER_NETWORK_ISOLATED: "true"
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    volumes:
      - ${INPUT_DIR:-./input}:/input:ro
      - ${OUTPUT_DIR:-./output}:/output:ro
      - runner-control-acp:/runner

  llm-bin-patch-legacy:
    profiles:
      - legacy-acceptance
    build:
      context: .
      args:
        APP_UID: ${LOCAL_UID:-1000}
        APP_GID: ${LOCAL_GID:-1000}
    init: true
    stdin_open: true
    tty: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - binary-runner
    environment:
      ACP_HARNESS: legacy-openai
      BINARY_RUNNER_DIR: /runner
      BASE_URL: ${BASE_URL:-}
      API_KEY: ${API_KEY:-}
      MODEL: ${MODEL:-}
      REASONING_EFFORT: ${REASONING_EFFORT:-}
    tmpfs:
      - /tmp:size=512m,nosuid,nodev,mode=1777
    volumes:
      - ${INPUT_DIR:-./input}:/input:ro
      - ${OUTPUT_DIR:-./output}:/output
      - runner-control:/runner
  binary-runner:
    build:
      context: .
      args:
        APP_UID: ${LOCAL_UID:-1000}
        APP_GID: ${LOCAL_GID:-1000}
    entrypoint: ["llm_bin_patch", "runner", "--control-dir", "/runner"]
    init: true
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      RUNNER_NETWORK_ISOLATED: "true"
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    volumes:
      - ${INPUT_DIR:-./input}:/input:ro
      - ${OUTPUT_DIR:-./output}:/output:ro
      - runner-control:/runner
  fixture-builder:
    profiles:
      - acceptance
    build:
      context: .
      args:
        APP_UID: ${LOCAL_UID:-1000}
        APP_GID: ${LOCAL_GID:-1000}
    entrypoint:
      - clang
    command:
      - -O0
      - -Wall
      - -Wextra
      - -std=c11
      - -fno-stack-protector
      - -U_FORTIFY_SOURCE
      - -D_FORTIFY_SOURCE=0
      - /fixture/01_out_of_bounds_write.c
      - -o
      - /input/binary_01
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev,mode=1777
    volumes:
      - ${CVUL_SOURCE_DIR:-./benchmarks/fixtures/c-vul/src}:/fixture:ro
      - ${INPUT_DIR:-./input}:/input

  mvp-fake-provider:
    profiles:
      - acceptance
    build:
      context: .
      args:
        APP_UID: ${LOCAL_UID:-1000}
        APP_GID: ${LOCAL_GID:-1000}
    entrypoint:
      - python3
      - -u
      - /provider/fake_openai_provider.py
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=1).read()"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 1s
    tmpfs:
      - /tmp:size=8m,noexec,nosuid,nodev,mode=1777
    volumes:
      - ./benchmarks/fixtures/mvp-c-vul/fake_openai_provider.py:/provider/fake_openai_provider.py:ro

volumes:
  runner-control-acp:
  runner-control:

networks:
  default:
    internal: ${MVP_FAKE_PROVIDER:-false}
