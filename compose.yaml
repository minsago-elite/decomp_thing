services:
  llm-bin-patch:
    build:
      context: .
      args:
        APP_UID: ${LOCAL_UID:-1000}
        APP_GID: ${LOCAL_GID:-1000}
    init: true
    stdin_open: true
    tty: true
    depends_on:
      - binary-runner
    environment:
      BINARY_RUNNER_DIR: /runner
      BASE_URL: ${BASE_URL:-}
      API_KEY: ${API_KEY:-}
      MODEL: ${MODEL:-}
      REASONING_EFFORT: ${REASONING_EFFORT:-}
    volumes:
      - ${INPUT_DIR:-./input}:/input:ro
      - ${OUTPUT_DIR:-./output}:/output
      - runner-control:/runner
  binary-runner:
    build:
      context: .
      args:
        APP_UID: ${LOCAL_UID:-1000}
        APP_GID: ${LOCAL_GID:-1000}
    entrypoint: ["llm_bin_patch", "runner", "--control-dir", "/runner"]
    init: true
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      RUNNER_NETWORK_ISOLATED: "true"
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    volumes:
      - ${INPUT_DIR:-./input}:/input:ro
      - ${OUTPUT_DIR:-./output}:/output:ro
      - runner-control:/runner
  fixture-builder:
    profiles:
      - acceptance
    build:
      context: .
      args:
        APP_UID: ${LOCAL_UID:-1000}
        APP_GID: ${LOCAL_GID:-1000}
    entrypoint:
      - clang
    command:
      - -O0
      - -Wall
      - -Wextra
      - -std=c11
      - -fno-stack-protector
      - -U_FORTIFY_SOURCE
      - -D_FORTIFY_SOURCE=0
      - /fixture/01_out_of_bounds_write.c
      - -o
      - /input/binary_01
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev,mode=1777
    volumes:
      - ${CVUL_SOURCE_DIR:-./benchmarks/fixtures/c-vul/src}:/fixture:ro
      - ${INPUT_DIR:-./input}:/input

  mvp-fake-provider:
    profiles:
      - acceptance
    build:
      context: .
      args:
        APP_UID: ${LOCAL_UID:-1000}
        APP_GID: ${LOCAL_GID:-1000}
    entrypoint:
      - python3
      - -u
      - /provider/fake_openai_provider.py
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=1).read()"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 1s
    tmpfs:
      - /tmp:size=8m,noexec,nosuid,nodev,mode=1777
    volumes:
      - ./benchmarks/fixtures/mvp-c-vul/fake_openai_provider.py:/provider/fake_openai_provider.py:ro

volumes:
  runner-control:

networks:
  default:
    internal: ${MVP_FAKE_PROVIDER:-false}
